<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin • GlobeX</title>

<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white}
.header{background:#1e293b;padding:15px;text-align:center;font-weight:bold}
.card{background:#1e293b;margin:12px;padding:15px;border-radius:10px}
input,textarea{width:100%;padding:12px;margin-top:8px;border-radius:6px;border:none;background:#0f172a;color:white}
button{width:100%;padding:12px;margin-top:10px;background:#2563eb;color:white;border:none;border-radius:6px}
.hidden{display:none}
</style>
</head>

<body>

<div class="header">Admin Dashboard</div>

<!-- LOGIN -->
<div id="loginBox" class="card">
<h3>Admin Login</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- ADMIN -->
<div id="adminPanel" class="hidden">

<div class="card">
<h3>Create Shipment</h3>

<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="status" placeholder="Status">
<textarea id="history" placeholder="Timeline (comma separated)"></textarea>

<input id="receiverName" placeholder="Receiver Name">
<input id="receiverAddress" placeholder="Receiver Address">

<button onclick="save()">Save Shipment</button>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Shipments</h3>
<div id="list"></div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
  authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
  projectId: "globaltrackingsystem-f14c2"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* LOGIN */
async function login(){
  try{
    await auth.signInWithEmailAndPassword(email.value, password.value);
  }catch(e){
    alert(e.message);
  }
}

/* LOGOUT */
function logout(){
  auth.signOut();
}

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
  if(user){
    loginBox.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    loadList();
  }else{
    loginBox.classList.remove("hidden");
    adminPanel.classList.add("hidden");
  }
});

/* SAVE */
async function save(){

  const code="GLO"+Math.floor(100000+Math.random()*900000);

  await db.collection("shipments").doc(code).set({
    from:from.value,
    to:to.value,
    status:status.value || "In transit",
    history:history.value ? history.value.split(",") : [],
    receiverName:receiverName.value,
    receiverAddress:receiverAddress.value
  });

  alert("Saved: "+code);
}

/* LIST */
function loadList(){
  db.collection("shipments").onSnapshot(snap=>{
    list.innerHTML="";
    snap.forEach(doc=>{
      let d=doc.data();

      list.innerHTML+=`
      <div style="margin-top:10px">
        <b>${doc.id}</b><br>
        ${d.from} → ${d.to}<br>
        ${d.receiverName}
      </div>`;
    });
  });
}

</script>

</body>
</html>
