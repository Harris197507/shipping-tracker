<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>

<style>
body{font-family:sans-serif;background:#0f172a;color:white}
.card{background:#1e293b;margin:10px;padding:15px;border-radius:10px}
input,textarea{width:100%;padding:10px;margin-top:5px;background:#0f172a;color:white;border:none}
button{margin-top:10px;padding:10px;width:100%;background:#2563eb;color:white;border:none}
.hidden{display:none}
</style>
</head>

<body>

<div id="loginBox" class="card">
<h3>Login</h3>
<input id="email">
<input id="password" type="password">
<button onclick="login()">Login</button>
</div>

<div id="panel" class="hidden">

<div class="card">
<h3>Create Shipment</h3>

<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="status" placeholder="Status">
<textarea id="history" placeholder="Timeline comma"></textarea>

<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">

<input id="weight" placeholder="Weight">
<input id="type" placeholder="Type">
<input id="courier" placeholder="Courier">
<input id="eta" placeholder="ETA">

<button onclick="save()">Save</button>
<button onclick="logout()">Logout</button>

</div>

<div class="card">
<div id="list"></div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
  authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
  projectId: "globaltrackingsystem-f14c2"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(e=>alert(e.message));
}

function logout(){
  auth.signOut();
}

auth.onAuthStateChanged(u=>{
  if(u){
    loginBox.classList.add("hidden");
    panel.classList.remove("hidden");
    load();
  }else{
    loginBox.classList.remove("hidden");
    panel.classList.add("hidden");
  }
});

async function save(){

  const code = "GLO"+Math.floor(100000+Math.random()*900000);

  await db.collection("shipments").doc(code).set({
    from:from.value,
    to:to.value,
    status:status.value,
    history:history.value.split(","),
    receiverName:receiverName.value,
    receiverAddress:receiverAddress.value,
    weight:weight.value,
    type:type.value,
    courier:courier.value,
    eta:eta.value,
    progress:0
  });

  alert("Created "+code);
}

function load(){
  db.collection("shipments").onSnapshot(s=>{
    list.innerHTML="";
    s.forEach(doc=>{
      list.innerHTML+=`
      <div>
      ${doc.id}
      <button onclick="copy('${doc.id}')">Copy Link</button>
      </div>`;
    });
  });
}

function copy(id){
  const link = location.origin + "/shipping-tracker/?code="+id;
  navigator.clipboard.writeText(link);
  alert("Copied");
}

</script>

</body>
</html>
