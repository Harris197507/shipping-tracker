<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
</head>
<body>

<h2>Admin Panel</h2>

<input id="code" placeholder="Tracking Code"><br><br>
<input id="from" placeholder="From"><br><br>
<input id="to" placeholder="To"><br><br>
<input id="status" placeholder="Status"><br><br>

<button onclick="saveTracking()">SAVE TRACKING</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQr2KtnYQWNUmFu_...",
  authDomain: "fedex-tracking-system.firebaseapp.com",
  projectId: "fedex-tracking-system",
  storageBucket: "fedex-tracking-system.appspot.com",
  messagingSenderId: "936338746045",
  appId: "1:936338746045:web:b325...",
  measurementId: "G-ZGWD5F7LP5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveTracking = async function () {
  const code = document.getElementById("code").value;
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const status = document.getElementById("status").value;

  await setDoc(doc(db, "shipments", code), {
    from,
    to,
    status
  });

  alert("✅ Saved successfully!");
};
</script>

</body>
</html>
