<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin • GlobeX</title>

<style>
body{margin:0;font-family:sans-serif;background:#f3f3f3}
.header{background:#4d148c;color:white;padding:15px;text-align:center}
.card{background:white;margin:12px;padding:15px;border-radius:10px}
input,textarea{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:1px solid #ccc}
button{width:100%;padding:10px;margin-top:10px;background:#ff6200;color:white;border:none;border-radius:6px}
</style>
</head>

<body>

<div class="header">Admin Dashboard</div>

<div class="card">
<h3>Create Shipment</h3>

<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="status" placeholder="Status">
<textarea id="history" placeholder="Timeline (comma separated)"></textarea>

<input id="receiverName" placeholder="Receiver Name">
<input id="receiverAddress" placeholder="Receiver Address">

<button onclick="save()">Save Shipment</button>
</div>

<div class="card">
<h3>Shipments</h3>
<div id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
  authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
  projectId: "globaltrackingsystem-f14c2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function save(){

  if(!from.value || !to.value || !receiverName.value || !receiverAddress.value){
    alert("Fill all fields");
    return;
  }

  const code="GLO"+Math.floor(100000+Math.random()*900000);

  await db.collection("shipments").doc(code).set({
    from:from.value,
    to:to.value,
    status:status.value || "In transit",
    history:history.value ? history.value.split(",").map(x=>x.trim()) : [],
    receiverName:receiverName.value,
    receiverAddress:receiverAddress.value
  });

  alert("Saved: "+code);

  from.value="";
  to.value="";
  status.value="";
  history.value="";
  receiverName.value="";
  receiverAddress.value="";
}

function loadList(){
  db.collection("shipments").onSnapshot(snap=>{
    list.innerHTML="";
    snap.forEach(doc=>{
      let d=doc.data();

      list.innerHTML+=`
      <div style="margin-top:10px">
        <b>${doc.id}</b><br>
        ${d.from} → ${d.to}<br>
        ${d.receiverName}<br>
        <button onclick="del('${doc.id}')">Delete</button>
      </div>`;
    });
  });
}

function del(id){
  db.collection("shipments").doc(id).delete();
}

loadList();

</script>

</body>
</html>
