<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Tracking</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    h2 {
      text-align: center;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      background: orange;
      color: white;
      border: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>📦 Admin Panel</h2>

  <input id="code" placeholder="Tracking Code">
  <input id="from" placeholder="From">
  <input id="to" placeholder="To">
  <input id="status" placeholder="Status">

  <textarea id="history" placeholder="History (one per line)
Example:
Package received - China
In transit - Dubai
Delivered - Philippines"></textarea>

  <button onclick="saveTracking()">SAVE TRACKING</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQr2KtnYQWNUmFu_...",
  authDomain: "fedex-tracking-system.firebaseapp.com",
  projectId: "fedex-tracking-system",
  storageBucket: "fedex-tracking-system.appspot.com",
  messagingSenderId: "936338746045",
  appId: "1:936338746045:web:b325...",
  measurementId: "G-ZGWD5F7LP5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveTracking = async function () {
  let code = document.getElementById("code").value;
  let from = document.getElementById("from").value;
  let to = document.getElementById("to").value;
  let status = document.getElementById("status").value;

  try {
    await setDoc(doc(db, "shipments", code), {
      from,
      to,
      status,
      history: []
    });

    alert("✅ Saved successfully!");
  } catch (error) {
    alert("❌ " + error.message);
  }
};
</script>
</html>
