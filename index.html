<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<style>
body{
  font-family:Arial;
  background:#1a0033;
  color:white;
  padding:20px;
}
.card{
  background:#fff;
  color:#000;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}
input,textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:orange;
  border:none;
  color:white;
}
.hidden{display:none;}
</style>
</head>

<body>

<h2>🌍 GlobeX Logistics</h2>

<!-- ADMIN ACCESS -->
<div class="card">
<h3>Enter Admin Code</h3>
<input id="adminCode" placeholder="Enter admin code">
<button onclick="openAdmin()">Enter</button>
</div>

<!-- TRACK -->
<div class="card">
<input id="trackInput" placeholder="Enter Tracking Code">
<button onclick="track()">Track</button>
</div>

<!-- ADMIN -->
<div id="adminPage" class="card hidden">
<h3>Create Shipment</h3>

<input id="from" placeholder="From">
<input id="to" placeholder="To">
<textarea id="history" placeholder="Timeline"></textarea>

<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">

<button onclick="save()">Save</button>
</div>

<!-- RESULT -->
<div id="result" class="card hidden"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
  authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
  projectId: "globaltrackingsystem-f14c2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ADMIN CODE (CHANGE THIS) */
const ADMIN = "1234";

window.openAdmin = () => {
  if(adminCode.value === ADMIN){
    adminPage.classList.remove("hidden");
  } else {
    alert("Wrong code");
  }
};

/* SAVE */
window.save = async ()=>{
  let code = "GLO"+Math.floor(100000+Math.random()*900000);

  await setDoc(doc(db,"shipments",code),{
    from: from.value,
    to: to.value,
    history: history.value.split(","),
    receiverName: receiverName.value,
    receiverAddress: receiverAddress.value
  });

  alert("Saved: "+code);
};

/* TRACK */
window.track = async ()=>{
  let snap = await getDoc(doc(db,"shipments",trackInput.value));

  if(!snap.exists()){
    alert("Not found");
    return;
  }

  let d = snap.data();

  result.classList.remove("hidden");

  result.innerHTML = `
    <h3>${trackInput.value}</h3>
    <p>${d.from} → ${d.to}</p>
    <p>${d.history.join("<br>")}</p>
    <p>${d.receiverName}</p>
  `;
};

</script>

</body>
</html>
