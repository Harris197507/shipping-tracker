<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{font-family:'Segoe UI',sans-serif;margin:0;background:#0d1117;color:#fff}
.header{background:linear-gradient(90deg,#4D148C,#FF6600);padding:20px;text-align:center;font-size:22px;font-weight:bold}
.container{max-width:520px;margin:20px auto;background:#161b22;padding:20px;border-radius:12px}
input{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none;background:#30363d;color:#fff}
button{width:100%;padding:12px;margin-top:10px;background:#FF6600;color:#fff;border:none;border-radius:8px;font-weight:bold}
.status{padding:12px;border-radius:10px;margin-top:10px;background:#1c2e40}
.history{background:#30363d;padding:10px;margin-top:8px;border-radius:8px}
#map{height:250px;margin-top:15px;border-radius:10px}
.admin-btn{position:fixed;bottom:20px;right:20px;width:55px;height:55px;border-radius:50%;background:#4D148C;color:#fff;font-size:22px}
.hidden{display:none}
</style>
</head>

<body>

<div class="header">
🌍 GlobeX Logistics ✈️
<p>Delivering Beyond Borders 🚚📦</p>
</div>

<div class="container" id="trackPage">
<h2>Track Shipment 📦</h2>
<input id="trackInput" placeholder="Enter tracking code">
<button onclick="track()">Track 🚀</button>
<div id="result"></div>
<div id="map"></div>
</div>

<div class="container hidden" id="loginPage">
<h2>Admin Login 🔐</h2>
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="container hidden" id="adminPage">
<h2>Admin Panel ⚙️</h2>
<input id="code" placeholder="Tracking Code">
<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="date" placeholder="Delivery Date YYYY-MM-DD">
<button onclick="save()">Save</button>
<div id="list"></div>
</div>

<button class="admin-btn" onclick="openAdmin()">⚙️</button>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
authDomain:"globaltrackingsystem-f14c2.firebaseapp.com",
projectId:"globaltrackingsystem-f14c2"
});

const db = getFirestore(app);

let map, marker, line;

window.track = async ()=>{
let code = document.getElementById("trackInput").value.trim();
if(!code){ result.innerHTML="Enter tracking code"; return; }

let snap = await getDoc(doc(db,"shipments",code));
if(!snap.exists()){ result.innerHTML="❌ Not found"; return; }

let d = snap.data();

result.innerHTML = `
<h3>${code}</h3>
<div class="status">📦 In Transit</div>
<p><b>From:</b> ${d.from}</p>
<p><b>To:</b> ${d.to}</p>
`;

loadMap(d.route);
};

function loadMap(route){
if(!route || route.length < 2){ return; }

let coords = route.map(p=>[p.lat,p.lng]);

if(!map){
map = L.map('map').setView(coords[0],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

if(line) map.removeLayer(line);
if(marker) map.removeLayer(marker);

line = L.polyline(coords,{color:'orange'}).addTo(map);
marker = L.marker(coords[0]).addTo(map);

map.fitBounds(line.getBounds());

let i=0;
setInterval(()=>{
i++;
if(i>=coords.length) i=0;
marker.setLatLng(coords[i]);
},2000);
}

window.openAdmin=()=>{
trackPage.classList.add("hidden");
loginPage.classList.remove("hidden");
};

window.login=()=>{
if(pass.value==="admin123"){
loginPage.classList.add("hidden");
adminPage.classList.remove("hidden");
load();
}else alert("Wrong password");
};

window.save=async()=>{
await setDoc(doc(db,"shipments",code.value),{
from:from.value,
to:to.value,
deliveryDate:date.value,
route:[
{lat:26,lng:119},
{lat:22,lng:121},
{lat:18,lng:122},
{lat:14,lng:121}
]
});
alert("Saved ✅");
load();
};

async function load(){
const snap = await getDocs(collection(db,"shipments"));
let html="";
snap.forEach(d=>{
html+=`<div class="history">${d.id}</div>`;
});
list.innerHTML = html;
}
</script>

</body>
</html>
