<!DOCTYPE html>
<html>
<head>
  <title>Global Express Tracking</title>

  <style>
* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
}

/* HEADER */
.header {
  background: #4D148C;
  color: white;
  padding: 18px;
  font-size: 22px;
  font-weight: bold;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* CARD */
.container {
  max-width: 500px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ddd;
  margin-bottom: 10px;
  font-size: 16px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  background: #ff6600;
  border: none;
  color: white;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #e65c00;
}

/* STATUS */
.status {
  font-weight: bold;
  color: #28a745;
  margin-top: 15px;
}

/* PROGRESS */
.progress {
  background: #eee;
  border-radius: 20px;
  overflow: hidden;
  margin: 10px 0;
}

.progress-bar {
  height: 10px;
  background: linear-gradient(90deg, #4D148C, #ff6600);
  transition: width 0.5s ease;
}

p {
  margin: 8px 0;
}

ul {
  padding-left: 18px;
}

li {
  margin-bottom: 6px;
}

.delivery-box {
  background: #f8f9fa;
  padding: 10px;
  border-radius: 6px;
  margin-top: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="header">Global Express Tracking</div>

<div class="container">
  <h2>Track Your Shipment</h2>

  <input id="tracking-input" placeholder="Enter tracking code">
  <button onclick="track()">Track</button>

  <div id="result" class="result"></div>
</div>

<script type="module">

async function track() {

  const trackingCode = document.getElementById("tracking-input").value;

  const docRef = doc(db, "tracking", trackingCode);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {

    const data = docSnap.data();

    let statusColor = "#ff9800";

    if (data.status === "Delivered") statusColor = "#28a745";
    if (data.status === "Pending") statusColor = "#dc3545";



let historyHTML = "";

data.history.forEach((item, index) => {
  historyHTML += `
    <div class="timeline-item">
      <div class="circle"></div>
      <div class="content">${item}</div>
    </div>
  `;
});

document.getElementById("result").innerHTML =
  "<p class='status' style='color:" + statusColor + "'>Status: " + data.status + "</p>" +

  "<div class='progress'>" +
  "<div class='progress-bar' style='width:" + progress + "%'></div>" +
  "</div>" +

  "<p><strong>From:</strong> " + data.from + "</p>" +
  "<p><strong>To:</strong> " + data.to + "</p>" +

  "<div class='delivery-box'>" +
  "<p><strong>Estimated Delivery:</strong> " + data.deliveryDate + "</p>" +
  "<p><strong>Days Left:</strong> " + daysLeft + " day(s)</p>" +
  "</div>" +

"<div class='timeline'>" + historyHTML + "</div>";

  

      

  } else {
    alert("Tracking code not found");
  }
};

</script>

</body>
</html>
