<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#eef1f5;}

.header{
background:linear-gradient(90deg,#6a11cb,#ff6600);
color:#fff;
text-align:center;
padding:20px;
}

.container{
max-width:520px;
margin:15px auto;
background:#fff;
padding:20px;
border-radius:20px;
}

input{
width:100%;
padding:14px;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
background:#ff6600;
color:#fff;
font-weight:bold;
}

.card{
background:#f5f6f8;
padding:15px;
margin-top:10px;
border-radius:15px;
}

.admin-btn{
position:fixed;
bottom:25px;
right:25px;
width:60px;
height:60px;
border-radius:50%;
background:#6a11cb;
color:#fff;
font-size:24px;
border:none;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="header">
🌍 GlobeX Logistics 🚚📦
</div>

<div class="container" id="trackPage">
<input id="trackInput" placeholder="Enter tracking code">
<button onclick="track()">Track</button>
<div id="result"></div>
</div>

<div class="container hidden" id="loginPage">
<input id="password" placeholder="Admin password">
<button onclick="login()">Login</button>
</div>

<div class="container hidden" id="adminPage">
<h2>Admin Panel ⚙️</h2>

<input id="code" placeholder="Tracking Code">
<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="date" placeholder="Delivery Date">

<input id="history" placeholder="Status (comma separated)">

<input id="name" placeholder="Customer Name">
<input id="address" placeholder="Address">
<input id="phone" placeholder="Phone">

<button onclick="save()">Save</button>

<div id="list"></div>
</div>

<button class="admin-btn" onclick="openAdmin()">⚙️</button>

<script>

firebase.initializeApp({
apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
projectId: "globaltrackingsystem-f14c2"
});

const db = firebase.firestore();

/* LOGIN */
function openAdmin(){
trackPage.classList.add("hidden");
loginPage.classList.remove("hidden");
}

function login(){
if(password.value==="admin123"){
loginPage.classList.add("hidden");
adminPage.classList.remove("hidden");
load();
}else{
alert("Wrong password");
}
}

/* SAVE */
function save(){
db.collection("shipments").doc(code.value).set({
from:from.value,
to:to.value,
date:date.value,
history:history.value.split(","),
name:name.value,
address:address.value,
phone:phone.value
});

alert("Saved");
load();
}

/* LOAD */
function load(){
db.collection("shipments").get().then(snap=>{
let html="";
snap.forEach(doc=>{
html+=`
<div class="card">
${doc.id}
<button onclick="del('${doc.id}')">Delete</button>
</div>`;
});
list.innerHTML=html;
});
}

/* DELETE */
function del(id){
db.collection("shipments").doc(id).delete().then(load);
}

/* TRACK */
function track(){
db.collection("shipments").doc(trackInput.value).get().then(doc=>{
if(!doc.exists){
result.innerHTML="❌ Not found";
return;
}

let d=doc.data();

let h="";
d.history.forEach(i=>{
h+=`<div class="card">${i}</div>`;
});

result.innerHTML=`
<h3>${trackInput.value}</h3>

<p><b>From:</b> ${d.from}</p>
<p><b>To:</b> ${d.to}</p>

${h}

<div class="card">
${d.name}<br>
${d.address}<br>
${d.phone}
</div>
`;
});
}

</script>

</body>
</html>
