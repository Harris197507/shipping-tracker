<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics PRO</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle at top,#6a1b9a,#1a0033);
  color:#fff;
}

.header{
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
}

.card{
  max-width:650px;
  margin:20px auto;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
}

input, textarea{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  background:orange;
  color:white;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="header">🌍 GlobeX Logistics PRO</div>

<!-- LOGIN -->
<div id="loginPage" class="card">
<h3>Admin Login</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- TRACK -->
<div class="card">
<input id="trackInput" placeholder="Enter Tracking Code">
<button onclick="track()">Track Shipment</button>
</div>

<!-- ADMIN -->
<div id="adminPage" class="card hidden">

<h3>Create Shipment</h3>

<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="status" placeholder="Status (In transit)">
<textarea id="history" placeholder="Timeline (comma separated)"></textarea>

<h4>Receiver</h4>
<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">
<input id="receiverEmail" placeholder="Email">
<input id="receiverPhone" placeholder="Phone">

<button onclick="save()">Save Shipment</button>
<button onclick="logout()">Logout</button>

</div>

<!-- RESULT -->
<div id="result" class="card hidden"></div>

<script type="module">

// 🔥 Firebase Imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
  authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
  projectId: "globaltrackingsystem-f14c2",
  storageBucket: "globaltrackingsystem-f14c2.appspot.com",
  messagingSenderId: "199571170052",
  appId: "1:199571170052:web:d8bf1b09c17016979f6651"
};

// Init
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Elements
const loginPage = document.getElementById("loginPage");
const adminPage = document.getElementById("adminPage");
const result = document.getElementById("result");

// LOGIN
window.login = async () => {
  try {
    const cred = await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value.trim()
    );

    if (cred.user.email !== "admin@globex.com") {
      alert("❌ Admin only");
      await signOut(auth);
      return;
    }

    loginPage.classList.add("hidden");
    adminPage.classList.remove("hidden");
    alert("✅ Logged in");

  } catch (e) {
    alert("❌ " + e.message);
  }
};

// LOGOUT
window.logout = async ()=>{
  await signOut(auth);
  location.reload();
};

// GENERATE CODE
function gen(){
  return "GLO"+Math.floor(100000+Math.random()*900000);
}

// SAVE
window.save = async ()=>{
  let code = gen();

  await setDoc(doc(db,"shipments",code),{
    from: from.value,
    to: to.value,
    status: status.value || "In transit",
    history: history.value 
      ? history.value.split(",").map(x=>x.trim())
      : [],
    receiverName: receiverName.value,
    receiverAddress: receiverAddress.value,
    receiverEmail: receiverEmail.value,
    receiverPhone: receiverPhone.value
  });

  alert("Saved: "+code);
};

// TRACK
window.track = async ()=>{
  let id = trackInput.value.trim();

  let snap = await getDoc(doc(db,"shipments",id));

  if(!snap.exists()){
    alert("Not found");
    return;
  }

  let d = snap.data();

  result.classList.remove("hidden");

  result.innerHTML = `
    <h3>${id}</h3>
    <p><b>Status:</b> ${d.status}</p>
    <p><b>From:</b> ${d.from}</p>
    <p><b>To:</b> ${d.to}</p>
    <p><b>Receiver:</b> ${d.receiverName}</p>
    <p>${d.receiverAddress}</p>
  `;
};

</script>

</body>
</html>
