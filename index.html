<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<!-- PDF + QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{font-family:'Segoe UI',sans-serif;margin:0;background:#f4f6f9}
.header{background:linear-gradient(90deg,#4D148C,#FF6600);color:#fff;padding:20px;text-align:center}
.container{max-width:520px;margin:20px auto;background:#fff;padding:20px;border-radius:12px}
input,textarea{width:100%;padding:12px;margin-top:10px}
button{width:100%;padding:12px;margin-top:10px;background:#FF6600;color:#fff;border:none;border-radius:8px}
.status{padding:12px;border-radius:10px;margin-top:10px;color:#fff}
.history{background:#eee;padding:10px;margin-top:8px;border-radius:8px}
.timeline{border-left:4px solid #FF6600;padding-left:10px;margin-top:10px}
.hidden{display:none}
.admin-btn{position:fixed;bottom:80px;right:20px;width:55px;height:55px;border-radius:50%;background:#4D148C;color:#fff}
.watermark{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:60px;color:rgba(0,0,0,0.08)}
</style>
</head>

<body>

<div class="watermark">SAMPLE</div>

<div class="header">
🌍 GlobeX Logistics ✈️  
<p>Delivering Beyond Borders 🚚📦⛴️</p>
</div>

<div class="container">
<h2>Track Shipment 📦</h2>
<input id="trackInput" placeholder="Enter tracking code">
<button onclick="track()">Track 🚀</button>
<div id="result"></div>
</div>

<div id="qrcode" style="display:none;"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyBQr2KtnYQWNUmFu_54AUzmM1zMw2las14",
authDomain:"fedex-tracking-system.firebaseapp.com",
projectId:"fedex-tracking-system"
});

const db = getFirestore(app);

// TRACK
window.track=async()=>{
let code=trackInput.value.trim();
let snap=await getDoc(doc(db,"shipments",code));

if(!snap.exists()){
result.innerHTML="❌ Not found";
return;
}

let d=snap.data();

let historyHTML="";
(d.manualHistory||[]).forEach(h=>{
historyHTML+=`<div class="history">${h}</div>`;
});

let last=(d.manualHistory||[]).slice(-1);

result.innerHTML=`
<h3>${code}</h3>

<div class="status" style="background:#ff9800">${last}</div>

<p><b>🌏 From:</b> ${d.from}</p>
<p><b>📍 To:</b> ${d.to}</p>

<div class="timeline">${historyHTML}</div>

<br>

<h3>📦 Consignee</h3>
<div class="history">
👤 ${d.receiverName||""}<br>
📍 ${d.receiverAddress||""}<br>
📧 ${d.receiverEmail||""}<br>
📞 ${d.receiverPhone||""}
</div>

<button onclick="generatePDF('${code}')">📄 Download PDF</button>
`;
};

// PDF GENERATOR
window.generatePDF=function(code){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

doc.setFontSize(18);
doc.setTextColor(77,20,140);
doc.text("GLOBEX LOGISTICS",20,20);

doc.setFontSize(12);
doc.setTextColor(0,0,0);
doc.text("Tracking Code: "+code,20,35);

let y=50;
document.querySelectorAll(".history").forEach(h=>{
doc.text(h.innerText,20,y);
y+=10;
});

// QR
const qrContainer=document.getElementById("qrcode");
qrContainer.innerHTML="";
new QRCode(qrContainer, code);

setTimeout(()=>{
const img=qrContainer.querySelector("img").src;
doc.addImage(img,"PNG",140,30,50,50);

doc.setTextColor(255,0,0);
doc.text("GLOBEX OFFICIAL STAMP",20,y+20);

doc.save(code+"_receipt.pdf");
},500);
};

</script>

</body>
</html>
