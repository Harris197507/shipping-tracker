<!DOCTYPE html>
<html>
<head>
  <title>Tracking</title>
</head>
<body>

<h2>Track Package</h2>

<input id="tracking-input" placeholder="Enter Tracking Code"><br><br>
<button onclick="track()">Track</button>

<div id="result"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQr2KtnYQWNUmFu_...",
  authDomain: "fedex-tracking-system.firebaseapp.com",
  projectId: "fedex-tracking-system",
  storageBucket: "fedex-tracking-system.appspot.com",
  messagingSenderId: "936338746045",
  appId: "1:936338746045:web:b325...",
  measurementId: "G-ZGWD5F7LP5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.track = async function () {
  const code = document.getElementById("tracking-input").value;

  const docRef = doc(db, "shipments", code);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {
    const data = docSnap.data();

    document.getElementById("result").innerHTML = `
      <p>Status: ${data.status}</p>
      <p>From: ${data.from}</p>
      <p>To: ${data.to}</p>
    `;
  } else {
    alert("Tracking code not found");
  }
};
</script>

</body>
</html>
