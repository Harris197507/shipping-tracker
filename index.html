<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<!-- LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<style>
body{font-family:sans-serif;margin:0;background:#f4f6f9;transition:.3s}
.dark{background:#0d1117;color:#fff}

.header{background:linear-gradient(90deg,#4D148C,#FF6600);color:#fff;padding:20px;text-align:center}

.container{max-width:1000px;margin:20px auto;padding:15px}

.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
.dark .card{background:#161b22}

.grid{display:flex;gap:15px;flex-wrap:wrap}
.left{flex:2}
.right{flex:1}

.timeline{border-left:4px solid orange;padding-left:10px}
.history{background:#eee;padding:10px;margin-top:8px;border-radius:8px}
.dark .history{background:#30363d}

button{padding:10px;background:#FF6600;color:#fff;border:none;border-radius:8px}

input,textarea,select{
width:100%;padding:10px;margin-top:10px;border-radius:8px;border:1px solid #ccc
}

.map iframe{border-radius:10px}

.admin-btn{
position:fixed;
bottom:20px;
right:20px;
width:60px;height:60px;
background:#4D148C;
color:#fff;
border-radius:50%;
font-size:22px
}

.toggle{position:fixed;top:10px;right:10px}
.hidden{display:none}
</style>
</head>

<body>

<div class="toggle">
<button onclick="toggleDark()">🌙</button>
</div>

<div class="header">
🌍 GlobeX Logistics ✈️
<p>Global Shipment Tracking</p>
</div>

<div class="container">

<!-- TRACK -->
<div id="trackPage">
<div class="card">
<input id="trackInput" placeholder="Enter tracking code">
<button onclick="track()">Track</button>
</div>
<div id="result"></div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="hidden">
<div class="card">
<h3>Admin Login</h3>
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- ADMIN -->
<div id="adminPage" class="hidden">
<div class="card">
<h3>Create Shipment</h3>

<input id="code" placeholder="Tracking Code">
<input id="from" placeholder="From">
<input id="to" placeholder="To">

<select id="status">
<option>In transit</option>
<option>Out for delivery</option>
<option>Delivered</option>
<option>Delayed</option>
</select>

<textarea id="history" placeholder="Comma separated timeline"></textarea>

<h4>Receiver</h4>
<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">
<input id="receiverPhone" placeholder="Phone">

<button onclick="save()">Save</button>
</div>

<div id="list"></div>
</div>

</div>

<button class="admin-btn" onclick="openAdmin()">⚙️</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyBQr2KtnYQWNUmFu_54AUzmM1zMw2las14",
authDomain:"fedex-tracking-system.firebaseapp.com",
projectId:"fedex-tracking-system"
});

const db = getFirestore(app);

// DARK MODE
if(localStorage.getItem("dark")==="true") document.body.classList.add("dark");
window.toggleDark=()=>{
document.body.classList.toggle("dark");
localStorage.setItem("dark",document.body.classList.contains("dark"));
};

// TRACK
window.track = async () => {

let c = trackInput.value.trim();
let snap = await getDoc(doc(db,"shipments",c));

if(!snap.exists()){
result.innerHTML="Not found";
return;
}

let d = snap.data();

let timeline="";
(d.manualHistory||[]).forEach(h=>{
timeline+=`<div class="history">${h}</div>`;
});

result.innerHTML=`
<div class="grid">

<div class="left">
<div class="card">
<h3>Timeline</h3>
<div class="timeline">${timeline}</div>
</div>
</div>

<div class="right">

<div class="card"><b>Status:</b> ${d.status}</div>

<div class="card">
<p><b>From:</b> ${d.from}</p>
<p><b>To:</b> ${d.to}</p>
<p><b>Tracking:</b> ${c}</p>
</div>

<div class="card">
<div class="map">
<iframe width="100%" height="220"
src="https://maps.google.com/maps?q=${encodeURIComponent(d.from)} to ${encodeURIComponent(d.to)}&output=embed">
</iframe>
</div>
</div>

<div class="card">
<b>Receiver</b><br>
${d.receiverName}<br>
${d.receiverAddress}<br>
${d.receiverPhone}<br><br>

<button onclick="downloadPDF('${c}')">Download Receipt</button>
</div>

</div>

</div>
`;
};

// PDF
window.downloadPDF = async (code) => {

const { jsPDF } = window.jspdf;

let snap = await getDoc(doc(db,"shipments",code));
let d = snap.data();

const pdf = new jsPDF();

pdf.setFillColor(77,20,140);
pdf.rect(0,0,210,30,"F");

pdf.setTextColor(255,255,255);
pdf.text("GlobeX Logistics",15,18);

pdf.setTextColor(0,0,0);

pdf.text(`Tracking: ${code}`,20,50);
pdf.text(`From: ${d.from}`,20,60);
pdf.text(`To: ${d.to}`,20,70);

pdf.text("Receiver:",20,90);
pdf.text(d.receiverName,20,100);

let qrDiv=document.createElement("div");
new QRCode(qrDiv,{text:location.href,width:80,height:80});
let qrImg=qrDiv.querySelector("img").src;
pdf.addImage(qrImg,"PNG",150,80,40,40);

let canvas=document.createElement("canvas");
JsBarcode(canvas,code);
pdf.addImage(canvas.toDataURL(),"PNG",20,140,150,30);

pdf.save(code+".pdf");
};

// ADMIN
window.openAdmin=()=>{
trackPage.classList.add("hidden");
loginPage.classList.remove("hidden");
};

window.login=()=>{
if(pass.value==="admin123"){
loginPage.classList.add("hidden");
adminPage.classList.remove("hidden");
load();
}else alert("Wrong password");
};

window.save=async()=>{
await setDoc(doc(db,"shipments",code.value),{
from:from.value,
to:to.value,
status:status.value,
manualHistory:history.value.split(","),
receiverName:receiverName.value,
receiverAddress:receiverAddress.value,
receiverPhone:receiverPhone.value
});
alert("Saved");
load();
};

// LOAD
async function load(){
let snap=await getDocs(collection(db,"shipments"));
let html="";
snap.forEach(d=>{
html+=`<div class="history">${d.id}
<button onclick="delItem('${d.id}')">Delete</button>
</div>`;
});
list.innerHTML=html;
}

// DELETE
window.delItem=async(id)=>{
await deleteDoc(doc(db,"shipments",id));
load();
};

</script>

</body>
</html>
