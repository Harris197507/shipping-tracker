<!DOCTYPE html>
<html>
<head>
  <title>Global Express Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
    }

    .header {
      background: linear-gradient(90deg, #4D148C, #FF6600);
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: #FF6600;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #e65c00;
    }

    .result {
      margin-top: 20px;
    }

    .status {
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .history-item {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .delivery-box {
      background: #e8f5e9;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 14px;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="header">Global Express Tracking</div>

<div class="container">
  <h2>Track Your Shipment</h2>

  <input id="tracking-input" placeholder="Enter tracking number">
  <button onclick="track()">Track</button>

  <div id="result" class="result"></div>
</div>

<script type="module">

// 🔥 FIREBASE IMPORT
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBQr2KtnYQWNUmFu_54AUzmM1zMw2las14",
  authDomain: "fedex-tracking-system.firebaseapp.com",
  projectId: "fedex-tracking-system",
  storageBucket: "fedex-tracking-system.firebasestorage.app",
  messagingSenderId: "936338746045",
  appId: "1:936338746045:web:b325204663ef1f7bece5d4",
  measurementId: "G-ZGWD5F7LP5"
};

// 🔥 INIT
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🚀 TRACK FUNCTION
window.track = async function () {

  const trackingCode = document.getElementById("tracking-input").value.trim();
  const resultDiv = document.getElementById("result");

  if (!trackingCode) {
    resultDiv.innerHTML = "<p class='error'>Enter tracking number</p>";
    return;
  }

  try {
    const docRef = doc(db, "shipments", trackingCode);
    const docSnap = await getDoc(docRef);

    if (docSnap.exists()) {

      const data = docSnap.data();

      let statusColor = "#ff9800";

      if (data.status === "Delivered") statusColor = "#4caf50";
      if (data.status === "Pending") statusColor = "#f44336";

      let historyHTML = "";

      if (data.history) {
        data.history.forEach(item => {
          historyHTML += `<div class="history-item">${item}</div>`;
        });
      }

      resultDiv.innerHTML = `
        <div class="status" style="background:${statusColor}; color:white;">
          Status: ${data.status}
        </div>

        <p><b>From:</b> ${data.from}</p>
        <p><b>To:</b> ${data.to}</p>

        ${historyHTML}

        <div class="delivery-box">
          Estimated Delivery: ${data.deliveryDate}
        </div>
      `;

    } else {
      resultDiv.innerHTML = "<p class='error'>Tracking number not found</p>";
    }

  } catch (error) {
    resultDiv.innerHTML = "<p class='error'>Error loading data</p>";
    console.error(error);
  }
};

</script>

</body>
</html>
