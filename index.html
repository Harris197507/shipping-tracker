<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#1a0033,#4b0082);
  color:white;
}
.header{padding:20px;font-size:22px;font-weight:bold;}
.card{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
  padding:20px;margin:20px;border-radius:20px;
}
input,textarea{
  width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;
}
button{
  width:100%;padding:14px;margin-top:15px;border:none;
  border-radius:10px;font-weight:bold;
  background:linear-gradient(45deg,orange,#ff4500);
  color:white;
}
.progress{background:#eee;border-radius:10px;overflow:hidden;margin-top:10px;}
.progress-bar{background:orange;color:white;padding:10px;text-align:center;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="header">🌍 GlobeX Logistics PRO</div>

<!-- ADMIN -->
<div class="card">
<h3>Admin Code</h3>
<input id="adminCode">
<button id="adminBtn">Enter</button>
</div>

<!-- TRACK -->
<div class="card">
<input id="trackInput" placeholder="Tracking Code">
<button id="trackBtn">Track Shipment</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPage" class="card hidden">

<h3>Create Shipment</h3>

<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="status" placeholder="Status">
<textarea id="history" placeholder="Timeline (comma separated)"></textarea>

<h4>Receiver</h4>
<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">
<input id="receiverEmail" placeholder="Email">
<input id="receiverPhone" placeholder="Phone">

<button id="saveBtn">Save Shipment</button>

</div>

<!-- RESULT -->
<div id="result" class="card hidden"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
  authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
  projectId: "globaltrackingsystem-f14c2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// WAIT UNTIL PAGE LOADS
window.addEventListener("DOMContentLoaded", ()=>{

// ADMIN BUTTON
document.getElementById("adminBtn").addEventListener("click", ()=>{
  if(document.getElementById("adminCode").value.trim() === "admin1234"){
    document.getElementById("adminPage").classList.remove("hidden");
    alert("Admin unlocked");
  }else{
    alert("Wrong code");
  }
});

// SAVE BUTTON
document.getElementById("saveBtn").addEventListener("click", async ()=>{

  try{
    const code = "GLO"+Math.floor(100000+Math.random()*900000);

    await db.collection("shipments").doc(code).set({
      from: from.value,
      to: to.value,
      status: status.value || "In transit",
      history: history.value
        ? history.value.split(",").map(x=>x.trim())
        : [],
      receiverName: receiverName.value,
      receiverAddress: receiverAddress.value,
      receiverEmail: receiverEmail.value,
      receiverPhone: receiverPhone.value,
      date: new Date().toDateString()
    });

    alert("✅ Saved: " + code);

  }catch(err){
    alert("❌ ERROR: " + err.message);
    console.error(err);
  }

});

// TRACK BUTTON
document.getElementById("trackBtn").addEventListener("click", async ()=>{

  const code = trackInput.value.trim();

  const snap = await db.collection("shipments").doc(code).get();

  if(!snap.exists){
    alert("Not found");
    return;
  }

  const d = snap.data();
  const progress = Math.min(d.history.length * 25, 100);

  document.getElementById("result").classList.remove("hidden");

  document.getElementById("result").innerHTML = `
    <h2>${code}</h2>
    <div class="progress">
      <div class="progress-bar" style="width:${progress}%">${progress}%</div>
    </div>
    <p><b>From:</b> ${d.from}</p>
    <p><b>To:</b> ${d.to}</p>

    <div id="map" style="height:250px;margin:10px 0;"></div>

    ${d.history.map(h=>"<p>📦 "+h+"</p>").join("")}
  `;

  const map = L.map('map').setView([10,10],2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  const fromCoords = [31.2304,121.4737];
  const toCoords = [14.5995,120.9842];

  const line = L.polyline([fromCoords,toCoords]).addTo(map);
  map.fitBounds(line.getBounds());

});

});

</script>

</body>
</html>
