<!DOCTYPE html>
<html>
<head>
  <title>Global Express Tracking</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      margin: 0;
    }

    .header {
      background: #4b0082;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: orange;
      color: white;
      border: none;
      font-weight: bold;
      border-radius: 5px;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .status {
      font-weight: bold;
      color: green;
    }

    .progress {
      height: 8px;
      background: #ddd;
      border-radius: 10px;
      margin: 15px 0;
    }

    .progress-bar {
      height: 100%;
      background: green;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="header">Global Express Tracking</div>

<div class="container">
  <h2>Track Your Shipment</h2>

  <input id="tracking-input" placeholder="Enter tracking code">
  <button onclick="track()">Track</button>

  <div id="result" class="result"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQr2KtnYQWNUmFu_...",
  authDomain: "fedex-tracking-system.firebaseapp.com",
  projectId: "fedex-tracking-system",
  storageBucket: "fedex-tracking-system.appspot.com",
  messagingSenderId: "936338746045",
  appId: "1:936338746045:web:b325...",
  measurementId: "G-ZGWD5F7LP5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.track = async function () {

  let code = document.getElementById("tracking-input").value;

  const docRef = doc(db, "shipments", code);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {

    const data = docSnap.data();
let totalSteps = data.totalSteps || data.history.length;
let progress = (data.history.length / totalSteps) * 100;

let today = new Date();
let delivery = new Date(data.deliveryDate);

let timeDiff = delivery - today;
let daysLeft = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));

      "<p class='status'>Status: " + data.status + "</p>" +

      "<div class='progress'>" +
      "<div class='progress-bar' style='width:" + progress + "%'></div>" +
      "</div>" +

     "<p><strong>From:</strong> " + data.from + "</p>" +
"<p><strong>To:</strong> " + data.to + "</p>" +
"<p><strong>Estimated Delivery:</strong> " + data.deliveryDate + "</p>" +

      "<hr>" +

      let historyHTML = "";

data.history.forEach(item => {
  historyHTML += "<li>" + item + "</li>";
});

document.getElementById("result").innerHTML =
"<p class='status'>Status: " + data.status + "</p>" +

"<div class='progress'>" +
"<div class='progress-bar' style='width:" + progress + "%'></div>" +
"</div>" +

"<p><strong>From:</strong> " + data.from + "</p>" +
"<p><strong>To:</strong> " + data.to + "</p>" +

"<hr>" +

"<h3>Shipment History</h3>" +
"<ul>" + historyHTML + "</ul>";

  } else {
    alert("Tracking code not found");
  }
};

</script>

</body>
</html>
