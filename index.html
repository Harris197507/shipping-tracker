<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Segoe UI;margin:0;background:#eef2f7}
.header{background:#4D148C;color:#fff;padding:18px;text-align:center;font-weight:bold}

.container{
max-width:650px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.1)
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#FF6600;
color:#fff;
border:none;
border-radius:8px;
font-weight:bold
}

.hidden{display:none}

.status{
padding:10px;
border-radius:8px;
color:#fff;
text-align:center;
margin-bottom:10px
}

.timeline{
border-left:4px solid #FF6600;
padding-left:10px;
margin-top:10px
}

.admin-btn{
position:fixed;
bottom:80px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:#4D148C;
color:#fff;
font-size:22px;
border:none
}
</style>
</head>

<body>

<div class="header">🌍 GlobeX Logistics PRO</div>

<!-- LOGIN -->
<div class="container" id="loginPage">
<h3>Login</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>
</div>

<!-- TRACK -->
<div class="container hidden" id="trackPage">
<input id="trackInput" placeholder="Enter tracking code">
<button onclick="track()">Track Shipment</button>
<div id="result"></div>
<button onclick="openAdmin()">⚙️ Admin</button>
</div>

<!-- ADMIN -->
<div class="container hidden" id="adminPage">
<h3>Create Shipment</h3>

<input id="code" placeholder="Tracking Code (Auto)" readonly>
<input id="from" placeholder="From">
<input id="to" placeholder="To">

<select id="status">
<option>In transit</option>
<option>Out for delivery</option>
<option>Delivered</option>
<option>Delayed</option>
</select>

<textarea id="history" placeholder="Timeline (comma separated)"></textarea>

<h4>Receiver</h4>
<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">
<input id="receiverEmail" placeholder="Email">
<input id="receiverPhone" placeholder="Phone">

<button onclick="save()">Save Shipment</button>

<div id="list"></div>

<button onclick="back()">⬅ Back</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
apiKey:"AIzaSyBQr2KtnYQWNUmFu_54AUzmM1zMw2las14",
authDomain:"fedex-tracking-system.firebaseapp.com",
projectId:"fedex-tracking-system"
});

const db = getFirestore(app);
const auth = getAuth(app);


// 🔐 SIGNUP
window.signup = async ()=>{
try{
await createUserWithEmailAndPassword(auth, email.value, password.value);
alert("✅ Account created");
}catch(err){
alert("❌ " + err.message);
}
};

// 🔐 LOGIN
window.login = async ()=>{
try{
await signInWithEmailAndPassword(auth, email.value, password.value);
loginPage.classList.add("hidden");
trackPage.classList.remove("hidden");
}catch(err){
alert("❌ " + err.message);
}
};

// 🔓 LOGOUT
window.logout = async ()=>{
await signOut(auth);
location.reload();
};


// 📦 GENERATE CODE
function generateCode(){
return "GLO" + Math.floor(10000 + Math.random()*90000);
}


// 💾 SAVE
window.save = async ()=>{
let trackingCode = code.value || generateCode();

await setDoc(doc(db,"shipments",trackingCode),{
from: from.value,
to: to.value,
status: status.value,
eta: new Date().toDateString(),
manualHistory: history.value.split(","),
receiverName: receiverName.value,
receiverAddress: receiverAddress.value,
receiverEmail: receiverEmail.value,
receiverPhone: receiverPhone.value
});

code.value = trackingCode;

alert("✅ Saved: " + trackingCode);
load();
};


// 📊 LOAD
async function load(){
let snap = await getDocs(collection(db,"shipments"));
let html="";
snap.forEach(d=>{
html += `<div>${d.id} <button onclick="del('${d.id}')">Delete</button></div>`;
});
list.innerHTML = html;
}


// ❌ DELETE
window.del = async(id)=>{
await deleteDoc(doc(db,"shipments",id));
load();
};


// 🔎 TRACK
window.track = async ()=>{
let codeVal = trackInput.value.trim();

let snap = await getDoc(doc(db,"shipments",codeVal));

if(!snap.exists()){
result.innerHTML = "❌ Not found";
return;
}

let d = snap.data();

result.innerHTML = `
<h3>${codeVal}</h3>

<div class="status" style="background:#ff9800">${d.status}</div>

<p><b>ETA:</b> ${d.eta}</p>
<p><b>From:</b> ${d.from}</p>
<p><b>To:</b> ${d.to}</p>

<div class="timeline">
${d.manualHistory.join("<br>")}
</div>

<iframe width="100%" height="220"
src="https://maps.google.com/maps?q=${encodeURIComponent(d.from)} to ${encodeURIComponent(d.to)}&output=embed"></iframe>

<p><b>${d.receiverName}</b></p>
<p>${d.receiverAddress}</p>
<p>${d.receiverEmail}</p>
<p>${d.receiverPhone}</p>
`;
};


// 🔧 ADMIN
window.openAdmin = ()=>{
trackPage.classList.add("hidden");
adminPage.classList.remove("hidden");
load();
};

window.back = ()=>{
adminPage.classList.add("hidden");
trackPage.classList.remove("hidden");
};

</script>

</body>
</html>
