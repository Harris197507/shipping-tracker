<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<style>
body{font-family:Segoe UI;margin:0;background:#0d1117;color:#fff}
.header{background:linear-gradient(90deg,#4D148C,#FF6600);padding:18px;text-align:center;font-size:20px;font-weight:bold}

.container{max-width:500px;margin:20px auto;padding:20px;background:#161b22;border-radius:12px}

input,textarea{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none}
button{width:100%;padding:12px;margin-top:10px;background:#FF6600;color:#fff;border:none;border-radius:8px;font-weight:bold}

.timeline{border-left:3px solid #FF6600;padding-left:15px;margin-top:15px}
.step{background:#30363d;padding:10px;margin-bottom:10px;border-radius:8px}
.time{font-size:12px;opacity:0.7;margin-top:5px}
.card{background:#30363d;padding:15px;border-radius:10px;margin-top:15px}

.admin-btn{position:fixed;bottom:20px;right:20px;background:#4D148C;color:#fff;border-radius:50%;width:60px;height:60px;font-size:22px}

.hidden{display:none}
</style>
</head>

<body>

<div class="header">🌍 GlobeX Logistics 📦</div>

<div class="container" id="trackPage">
<h3>Track Shipment</h3>
<input id="trackInput" placeholder="Tracking code">
<button onclick="track()">Track</button>
<div id="result"></div>
</div>

<div class="container hidden" id="loginPage">
<h3>Admin Login</h3>
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="container hidden" id="adminPage">
<h3>Admin Panel</h3>

<input id="code" placeholder="Tracking Code">
<input id="from" placeholder="From">
<input id="to" placeholder="To">

<input id="stepText" placeholder="Tracking Step">
<input id="stepDate" placeholder="Date (April 17)">
<input id="stepTime" placeholder="Time (10:30 AM)">

<input id="name" placeholder="Receiver Name">
<input id="address" placeholder="Address">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">

<button onclick="save()">Save</button>

<div id="list"></div>
</div>

<button class="admin-btn" onclick="openAdmin()">⚙️</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
projectId: "globaltrackingsystem-f14c2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function track(){
let code=document.getElementById("trackInput").value.trim();
if(!code) return;

let snap=await db.collection("shipments").doc(code).get();

if(!snap.exists){
document.getElementById("result").innerHTML="❌ Not found";
return;
}

let d=snap.data();
let steps=d.steps||[];

let html="<div class='timeline'>";
steps.forEach(s=>{
html+=`<div class="step">${s.text}<div class="time">${s.date} • ${s.time}</div></div>`;
});
html+="</div>";

document.getElementById("result").innerHTML=`
<p><b>From:</b> ${d.from}</p>
<p><b>To:</b> ${d.to}</p>
${html}
<div class="card">
<b>Consignee Details</b><br><br>
👤 ${d.name || ""}<br><br>
📍 ${d.address || ""}<br><br>
📧 ${d.email || ""}<br><br>
📞 ${d.phone || ""}
</div>
`;
}

function openAdmin(){
trackPage.classList.add("hidden");
loginPage.classList.remove("hidden");
}

function login(){
if(pass.value==="admin123"){
loginPage.classList.add("hidden");
adminPage.classList.remove("hidden");
load();
}else alert("Wrong password");
}

async function save(){
let code=document.getElementById("code").value;

let docRef=await db.collection("shipments").doc(code).get();
let oldSteps=[];

if(docRef.exists){
oldSteps=docRef.data().steps||[];
}

oldSteps.push({
text:stepText.value,
date:stepDate.value,
time:stepTime.value
});

await db.collection("shipments").doc(code).set({
from:from.value,
to:to.value,
name:name.value,
address:address.value,
phone:phone.value,
email:email.value,
steps:oldSteps
});

alert("Saved");
load();
}

async function load(){
let snap=await db.collection("shipments").get();
let html="";
snap.forEach(d=>{
html+=`<div class="step">${d.id} <button onclick="del('${d.id}')">Delete</button></div>`;
});
list.innerHTML=html;
}

async function del(id){
await db.collection("shipments").doc(id).delete();
load();
}
</script>

</body>
</html>
