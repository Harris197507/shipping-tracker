<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics Pro</title>

<style>
body{margin:0;font-family:Segoe UI;background:#eef2f7}

/* HEADER */
.header{
background:linear-gradient(135deg,#4D148C,#7B2FF7);
color:#fff;padding:20px;text-align:center;font-weight:bold
}

/* CARD */
.container{
max-width:700px;margin:20px auto;padding:20px;
background:#fff;border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.1)
}

input,select,textarea{
width:100%;padding:12px;margin-top:10px;
border-radius:10px;border:1px solid #ddd
}

button{
width:100%;padding:12px;margin-top:10px;
background:#FF6600;color:#fff;border:none;
border-radius:10px;font-weight:bold
}

.hidden{display:none}

/* PROGRESS */
.progress{height:10px;background:#eee;border-radius:10px;margin:10px 0}
.progress-bar{height:100%;background:#FF6600}

/* TRUCK */
.truck{
animation:move 5s linear infinite;font-size:24px
}
@keyframes move{
0%{transform:translateX(-20px)}
100%{transform:translateX(100%)}
}

/* ANALYTICS */
.stats{
display:flex;gap:10px;margin-top:10px
}
.stat{
flex:1;background:#f5f5f5;padding:10px;border-radius:10px;text-align:center
}
</style>
</head>

<body>

<div class="header">🌍 GlobeX Logistics PRO</div>

<!-- LOGIN -->
<div class="container" id="loginPage">
<h3>Login</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>
</div>

<!-- DASHBOARD -->
<div class="container hidden" id="dashboard">

<h3>Analytics Dashboard</h3>

<div class="stats">
<div class="stat"><b id="total">0</b><br>Total</div>
<div class="stat"><b id="delivered">0</b><br>Delivered</div>
<div class="stat"><b id="transit">0</b><br>Transit</div>
</div>

<h3>Create Shipment</h3>

<input id="code" readonly placeholder="Auto Code">
<input id="from" placeholder="From">
<input id="to" placeholder="To">

<select id="status">
<option>In transit</option>
<option>Out for delivery</option>
<option>Delivered</option>
</select>

<textarea id="history" placeholder="Timeline"></textarea>

<input id="receiverName" placeholder="Receiver">
<input id="receiverEmail" placeholder="Email">

<button onclick="save()">Save Shipment</button>

<div id="list"></div>

<button onclick="logout()">Logout</button>
</div>

<!-- TRACK -->
<div class="container hidden" id="trackPage">
<input id="trackInput" placeholder="Enter tracking code">
<button onclick="track()">Track</button>
<div id="result"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
apiKey:"AIzaSyBQr2KtnYQWNUmFu_54AUzmM1zMw2las14",
authDomain:"fedex-tracking-system.firebaseapp.com",
projectId:"fedex-tracking-system"
});

const db = getFirestore(app);
const auth = getAuth(app);

/* AUTH */
window.signup = async ()=>{
await createUserWithEmailAndPassword(auth,email.value,password.value);
alert("Account created");
};

window.login = async ()=>{
await signInWithEmailAndPassword(auth,email.value,password.value);
loginPage.classList.add("hidden");
dashboard.classList.remove("hidden");
load();
};

window.logout = async ()=>{
await signOut(auth);
location.reload();
};

/* GENERATE */
function generateCode(){
return "GLO"+Math.floor(10000+Math.random()*90000);
}

/* SAVE */
window.save = async ()=>{
let trackingCode = code.value || generateCode();

await setDoc(doc(db,"shipments",trackingCode),{
from: from.value,
to: to.value,
status: status.value,
eta: new Date().toDateString(),
manualHistory: history.value.split(","),
receiverName: receiverName.value,
receiverEmail: receiverEmail.value
});

code.value = trackingCode;
load();
};

/* LOAD + ANALYTICS */
async function load(){
let snap = await getDocs(collection(db,"shipments"));

let total=0, delivered=0, transit=0;

let html="";
snap.forEach(d=>{
total++;
if(d.data().status==="Delivered") delivered++;
else transit++;

html+=`<div>${d.id}</div>`;
});

list.innerHTML=html;

totalEl.innerText=total;
deliveredEl.innerText=delivered;
transitEl.innerText=transit;
}

/* TRACK */
window.track = async ()=>{
let snap = await getDoc(doc(db,"shipments",trackInput.value));

if(!snap.exists()){
result.innerHTML="Not found";
return;
}

let d = snap.data();

let progress = d.status==="Delivered"?100:50;

result.innerHTML = `
<h3>${trackInput.value}</h3>

<div class="progress">
<div class="progress-bar" style="width:${progress}%"></div>
</div>

<div class="truck">🚚</div>

<p>${d.status}</p>
<p>${d.from} → ${d.to}</p>

<iframe width="100%" height="200"
src="https://maps.google.com/maps?q=${encodeURIComponent(d.from)} to ${encodeURIComponent(d.to)}&output=embed"></iframe>
`;
};

</script>

</body>
</html>
