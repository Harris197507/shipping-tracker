<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#2b0057,#5a0dad);
  color:white;
}

.header{
  padding:20px;
  font-size:22px;
  font-weight:bold;
}

.card{
  background:white;
  color:black;
  margin:20px;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

input,textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:linear-gradient(45deg,orange,#ff6600);
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.hidden{display:none;}

.status{
  background:orange;
  color:white;
  padding:10px;
  border-radius:8px;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">🌍 GlobeX Logistics PRO</div>

<!-- ADMIN LOGIN -->
<div class="card">
<h3>Enter Admin Code</h3>
<input id="adminCode" placeholder="Enter admin code">
<button onclick="openAdmin()">Enter</button>
</div>

<!-- TRACK -->
<div class="card">
<input id="trackInput" placeholder="Enter Tracking Code">
<button onclick="track()">Track Shipment</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPage" class="card hidden">

<h3>Create Shipment</h3>

<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="status" placeholder="Status (In transit)">
<textarea id="history" placeholder="Timeline (comma separated)"></textarea>

<h4>Receiver</h4>
<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">
<input id="receiverEmail" placeholder="Email">
<input id="receiverPhone" placeholder="Phone">

<button onclick="save()">Save Shipment</button>

</div>

<!-- RESULT -->
<div id="result" class="card hidden"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
  authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
  projectId: "globaltrackingsystem-f14c2",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ADMIN CODE */
const ADMIN = "admin1234";

/* ADMIN LOGIN */
window.openAdmin = () => {
  console.log("clicked");

  if(adminCode.value.trim() === ADMIN){
    adminPage.classList.remove("hidden");
    alert("✅ Access granted");
  } else {
    alert("❌ Wrong code");
  }
};

/* SAVE */
window.save = async () => {

  let trackingCode = "GLO"+Math.floor(100000+Math.random()*900000);

  await setDoc(doc(db,"shipments",trackingCode),{
    from: from.value,
    to: to.value,
    status: status.value || "In transit",
    history: history.value 
      ? history.value.split(",").map(x=>x.trim())
      : [],
    receiverName: receiverName.value,
    receiverAddress: receiverAddress.value,
    receiverEmail: receiverEmail.value,
    receiverPhone: receiverPhone.value,
    date: new Date().toDateString()
  });

  alert("✅ Saved: "+trackingCode);
};

/* TRACK */
window.track = async () => {

  let code = trackInput.value.trim();

  let snap = await getDoc(doc(db,"shipments",code));

  if(!snap.exists()){
    alert("❌ Not found");
    return;
  }

  let d = snap.data();

  result.classList.remove("hidden");

  result.innerHTML = `
    <h3>${code}</h3>
    <div class="status">${d.status}</div>

    <p><b>From:</b> ${d.from}</p>
    <p><b>To:</b> ${d.to}</p>
    <p><b>ETA:</b> ${d.date}</p>

    <h4>Tracking Timeline</h4>
    ${d.history.map(h=>"<p>📦 "+h+"</p>").join("")}

    <h4>Receiver</h4>
    <p>${d.receiverName}</p>
    <p>${d.receiverAddress}</p>
    <p>${d.receiverEmail}</p>
    <p>${d.receiverPhone}</p>
  `;
};

</script>

</body>
</html>
