<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics PRO</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:linear-gradient(135deg,#4D148C,#0d001a);
  color:#fff;
}
.header{
  padding:20px;
  text-align:center;
  font-weight:bold;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
}
.container{
  max-width:650px;
  margin:20px auto;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(14px);
}
input,textarea,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:none;
}
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#ff6a00;
  color:#fff;
  font-weight:bold;
}
.hidden{display:none;}
.status{
  padding:12px;
  background:#ff9800;
  text-align:center;
  border-radius:10px;
}
.truck{
  font-size:30px;
  animation:move 4s linear infinite;
}
@keyframes move{
  0%{transform:translateX(-100px);}
  100%{transform:translateX(250px);}
}
</style>
</head>

<body>

<div class="header">🌍 GlobeX Logistics PRO</div>

<!-- LOGIN -->
<div class="container" id="loginPage">
<h3>Admin Login</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- TRACK -->
<div class="container" id="trackPage">
<input id="trackInput" placeholder="Enter Tracking Code">
<button onclick="track()">Track</button>
<div id="result"></div>
</div>

<!-- ADMIN -->
<div class="container hidden" id="adminPage">
<h3>Create Shipment</h3>

<input id="code" placeholder="Tracking Code (auto)">
<input id="from" placeholder="From">
<input id="to" placeholder="To">

<select id="status">
<option>In transit</option>
<option>Delivered</option>
<option>Delayed</option>
</select>

<textarea id="history" placeholder="Timeline comma separated"></textarea>

<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">
<input id="receiverEmail" placeholder="Email">
<input id="receiverPhone" placeholder="Phone">

<button onclick="save()">Save</button>
<button onclick="logout()">Logout</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* 🔥 YOUR CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* LOGIN */
window.login = async ()=>{
  try{
    await signInWithEmailAndPassword(auth,email.value,password.value);
    loginPage.classList.add("hidden");
    adminPage.classList.remove("hidden");
  }catch(e){
    alert("❌ "+e.message);
  }
};

/* LOGOUT */
window.logout = async ()=>{
  await signOut(auth);
  location.reload();
};

/* GENERATE */
function generateCode(){
  return "GLO"+Math.floor(100000+Math.random()*900000);
}

/* SAVE */
window.save = async ()=>{
  let trackingCode = code.value || generateCode();

  await setDoc(doc(db,"shipments",trackingCode),{
    from: from.value,
    to: to.value,
    status: status.value || "In transit",
    eta: new Date().toDateString(),
    manualHistory: history.value 
      ? history.value.split(",").map(x=>x.trim())
      : [],
    receiverName: receiverName.value,
    receiverAddress: receiverAddress.value,
    receiverEmail: receiverEmail.value,
    receiverPhone: receiverPhone.value
  });

  code.value = trackingCode;
  alert("✅ Saved "+trackingCode);
};

/* TRACK */
window.track = async ()=>{
  let snap = await getDoc(doc(db,"shipments",trackInput.value));
  if(!snap.exists()){
    result.innerHTML="❌ Not found";
    return;
  }

  let d = snap.data();

  result.innerHTML=`
    <h3>${trackInput.value}</h3>
    <div class="status">${d.status}</div>
    <div class="truck">🚚</div>
    <p><b>From:</b> ${d.from}</p>
    <p><b>To:</b> ${d.to}</p>
    ${d.manualHistory.map(x=>"<div>"+x+"</div>").join("")}
    <h4>${d.receiverName}</h4>
    <p>${d.receiverAddress}</p>
  `;
};

</script>

</body>
</html>
