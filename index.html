<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<!-- PDF LIB -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:sans-serif;margin:0;background:#f4f6f9;transition:.3s}
.dark{background:#0d1117;color:#fff}

.header{
background:linear-gradient(90deg,#4D148C,#FF6600);
color:#fff;
padding:20px;
text-align:center;
font-weight:bold
}

.container{max-width:1000px;margin:20px auto;padding:15px}

.grid{display:flex;gap:15px;flex-wrap:wrap}
.left{flex:2}
.right{flex:1}

.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,0.08)
}
.dark .card{background:#161b22}

input,textarea,select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#FF6600;
color:#fff;
border:none;
border-radius:8px;
font-weight:bold
}

.status{
padding:12px;
border-radius:8px;
text-align:center;
color:#fff;
font-weight:bold
}

.timeline{border-left:4px solid #FF6600;padding-left:10px}
.history{background:#eee;padding:10px;margin-top:8px;border-radius:8px}
.dark .history{background:#30363d}

.admin-btn{
position:fixed;
bottom:20px;
right:20px;
background:#4D148C;
color:#fff;
width:60px;height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px
}

.toggle{position:fixed;top:10px;right:10px}
.hidden{display:none}

.footer{
background:#111;
color:#fff;
padding:20px;
text-align:center;
margin-top:30px
}
</style>
</head>

<body>

<div class="toggle">
<button onclick="toggleDark()">🌙</button>
</div>

<div class="header">
🌍 GlobeX Logistics ✈️  
<p style="font-size:13px;margin-top:5px">
International Freight • Secure Delivery • Verified Tracking
</p>
</div>

<div class="container">

<!-- TRACK -->
<div id="trackPage">
<div class="card">
<input id="trackInput" placeholder="Enter tracking code">
<button onclick="track()">Track Shipment</button>
</div>
<div id="result"></div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="hidden">
<div class="card">
<h3>Admin Login</h3>
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- ADMIN -->
<div id="adminPage" class="hidden">
<div class="card">
<h3>Create Shipment</h3>

<input id="code" placeholder="Tracking Code (Auto)" readonly>
<input id="from" placeholder="From">
<input id="to" placeholder="To">

<select id="status">
<option>In transit</option>
<option>Out for delivery</option>
<option>Delivered</option>
<option>Delayed</option>
</select>

<textarea id="history" placeholder="Comma separated timeline"></textarea>

<h4>Receiver</h4>
<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">
<input id="receiverPhone" placeholder="Phone">

<button onclick="save()">Save</button>
</div>

<div id="list"></div>
</div>

</div>

<div class="footer">
GlobeX Logistics © 2026<br>
Customer Support: support@globex.com
</div>

<div class="admin-btn" onclick="openAdmin()">⚙️</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyBQr2KtnYQWNUmFu_54AUzmM1zMw2las14",
authDomain:"fedex-tracking-system.firebaseapp.com",
projectId:"fedex-tracking-system"
});

const db = getFirestore(app);

// DARK MODE
if(localStorage.getItem("dark")==="true") document.body.classList.add("dark");
window.toggleDark=()=>{
document.body.classList.toggle("dark");
localStorage.setItem("dark",document.body.classList.contains("dark"));
};

// TRACK
window.track = async () => {

let c = trackInput.value.trim();
let snap = await getDoc(doc(db,"shipments",c));

if(!snap.exists()){
result.innerHTML="<div class='card'>❌ Tracking not found</div>";
return;
}

let d = snap.data();

let timeline="";
(d.manualHistory||[]).forEach(h=>{
timeline+=`<div class="history">✔ ${h}</div>`;
});

// STATUS COLOR
let color="#ff9800";
if(d.status==="Delivered") color="#28a745";
if(d.status==="Delayed") color="#dc3545";
if(d.status==="Out for delivery") color="#007bff";

result.innerHTML=`
<div class="grid">

<div class="left">
<div class="card">
<h3>Shipment Timeline</h3>
<div class="timeline">${timeline}</div>
</div>
</div>

<div class="right">

<div class="card">
<div class="status" style="background:${color};letter-spacing:1px">
🚚 ${d.status.toUpperCase()}
</div>
</div>

<div class="card">
<p><b>From:</b> ${d.from}</p>
<p><b>To:</b> ${d.to}</p>
<p style="background:#eee;padding:8px;border-radius:6px">
🔢 Tracking Code: <b>${c}</b>
</p>
</div>

<div class="card">
<iframe width="100%" height="300"
style="border-radius:10px;border:0"
src="https://maps.google.com/maps?q=${encodeURIComponent(d.from)} to ${encodeURIComponent(d.to)}&output=embed">
</iframe>
<div style="font-size:12px;padding:10px;color:#666">
📍 Live Shipment Route
</div>
</div>

<div class="card">
<b>Receiver</b><br><br>
${d.receiverName}<br><br>
${d.receiverAddress}<br><br>
${d.receiverPhone}

<br><br>
<button onclick="downloadPDF('${c}')">Download Receipt</button>
</div>

</div>

</div>
`;
};

// PDF
window.downloadPDF = async (code) => {

const { jsPDF } = window.jspdf;

let snap = await getDoc(doc(db,"shipments",code));
let d = snap.data();

const pdf = new jsPDF();

pdf.setFillColor(77,20,140);
pdf.rect(0,0,210,30,"F");

pdf.setTextColor(255,255,255);
pdf.setFontSize(16);
pdf.text("GlobeX Logistics", 15, 18);

pdf.setFontSize(10);
pdf.text("Official Delivery Receipt", 15, 25);

pdf.setTextColor(0,0,0);

pdf.text(`Tracking: ${code}`, 20, 50);
pdf.text(`From: ${d.from}`, 20, 60);
pdf.text(`To: ${d.to}`, 20, 70);
pdf.text(`Status: ${d.status}`, 20, 80);

pdf.text("Receiver:", 20, 100);
pdf.text(d.receiverName, 20, 110);
pdf.text(d.receiverAddress, 20, 120);
pdf.text(d.receiverPhone, 20, 130);

pdf.text("Service Charge: ____________", 20, 150);
pdf.text("Payment Status: Pending", 20, 160);

pdf.text("Receiver Signature: ____________________", 20, 180);

pdf.save(`receipt_${code}.pdf`);
};

// ADMIN
window.openAdmin=()=>{
trackPage.classList.add("hidden");
loginPage.classList.remove("hidden");
};

window.login=()=>{
if(pass.value==="admin123"){
loginPage.classList.add("hidden");
adminPage.classList.remove("hidden");
load();
}else alert("Wrong password");
};
function generateCode(){
const num = Math.floor(10000 + Math.random() * 90000);
return "GLO" + num;
}
window.save = async () => {

if(!from.value || !to.value){
alert("Please fill all required fields");
return;
}

let trackingCode = code.value || generateCode();

await setDoc(doc(db,"shipments",trackingCode),{
from: from.value.trim(),
to: to.value.trim(),
status: document.getElementById("status").value,
manualHistory: history.value ? history.value.split(",") : [],
receiverName: receiverName.value.trim(),
receiverAddress: receiverAddress.value.trim(),
receiverPhone: receiverPhone.value.trim()
});
code.value = trackingCode;
alert("✅ Saved successfully");
load();

} catch(err){
console.error(err);
alert("❌ Error: " + err.message);
}

};

// LOAD
async function load(){
let snap=await getDocs(collection(db,"shipments"));
let html="";
snap.forEach(d=>{
html+=`<div class="history">${d.id}
<button onclick="delItem('${d.id}')">Delete</button>
</div>`;
});
list.innerHTML=html;
}

// DELETE
window.delItem=async(id)=>{
await deleteDoc(doc(db,"shipments",id));
load();
};

</script>

</body>
</html>
