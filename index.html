<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:-apple-system, sans-serif;
  background:#0f172a;
  color:white;
}

.header{
  text-align:center;
  padding:15px;
  font-weight:600;
  background:#111827;
}

.card{
  margin:15px;
  padding:15px;
  background:#111827;
  border-radius:15px;
}

input, textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
}

.progress{
  background:#1f2937;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:10px;
  background:#22c55e;
}

.timeline .step{
  border-left:2px solid #374151;
  padding:8px;
  margin-top:6px;
}

.done{
  border-color:#22c55e;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="header">🌍 GlobeX Logistics PRO</div>

<!-- ADMIN -->
<div class="card">
<input id="adminCode" placeholder="Enter Admin Code">
<button onclick="openAdmin()">Enter</button>
</div>

<!-- TRACK -->
<div class="card">
<input id="trackInput" placeholder="Enter Tracking Code">
<button onclick="track()">Track Shipment</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPage" class="card hidden">

<h3>Create Shipment</h3>

<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="status" placeholder="Status (In transit)">
<textarea id="history" placeholder="Timeline (comma separated)"></textarea>

<h4>Receiver</h4>
<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">

<button onclick="save()">Save Shipment</button>

<h3>📦 Shipments</h3>
<div id="list"></div>

</div>

<!-- RESULT -->
<div id="result" class="card hidden"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
  authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
  projectId: "globaltrackingsystem-f14c2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🔐 ADMIN ACCESS
function openAdmin(){
  if(adminCode.value.trim() === "admin1234"){
    adminPage.classList.remove("hidden");
    loadList();
  }else{
    alert("Wrong admin code");
  }
}

// 💾 SAVE SHIPMENT
async function save(){

  try{
    const code = "GLO"+Math.floor(100000+Math.random()*900000);

    await db.collection("shipments").doc(code).set({
      from: from.value,
      to: to.value,
      status: status.value || "In transit",
      history: history.value ? history.value.split(",").map(x=>x.trim()) : [],
      receiverName: receiverName.value,
      receiverAddress: receiverAddress.value
    });

    alert("✅ Saved: " + code);

    loadList();

  }catch(e){
    alert(e.message);
  }
}

// 📦 LOAD LIST
function loadList(){

  db.collection("shipments").onSnapshot(snap=>{

    list.innerHTML = "";

    snap.forEach(doc=>{
      let d = doc.data();

      list.innerHTML += `
        <div style="margin-bottom:10px;">
          <b>${doc.id}</b><br>
          ${d.from || "-"} → ${d.to || "-"}<br>
          👤 ${d.receiverName || "No name"}<br>
          📍 ${d.receiverAddress || "No address"}

          <button onclick="del('${doc.id}')">Delete</button>
        </div>
      `;
    });

  });
}

// ❌ DELETE
async function del(id){
  await db.collection("shipments").doc(id).delete();
}

// 📍 TRACK
async function track(){

  let code = trackInput.value.trim();

  let snap = await db.collection("shipments").doc(code).get();

  if(!snap.exists){
    alert("Tracking not found");
    return;
  }

  let d = snap.data();
  let steps = d.history.length || 1;
  let progress = Math.min(steps * 25, 100);

  result.classList.remove("hidden");

  result.innerHTML = `
    <h2>${code}</h2>

    <div class="progress">
      <div class="progress-bar" style="width:${progress}%"></div>
    </div>

    <p>${d.from} → ${d.to}</p>

    <p><b>${d.status}</b></p>

    <p>👤 ${d.receiverName}</p>
    <p>📍 ${d.receiverAddress}</p>

    <div id="map" style="height:200px;margin:10px 0;"></div>

    <div class="timeline">
      ${d.history.map((h,i)=>`
        <div class="step ${i < progress/25 ? "done":""}">
          ${h}
        </div>
      `).join("")}
    </div>
  `;

  // 🌍 MAP
  let map = L.map('map').setView([10,10],2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  let fromCoords = [31.2304,121.4737]; // Shanghai
  let toCoords = [14.5995,120.9842];   // Manila

  let line = L.polyline([fromCoords,toCoords]).addTo(map);
  map.fitBounds(line.getBounds());
}

</script>

</body>
</html>
