<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<style>
body{font-family:'Segoe UI',sans-serif;margin:0;background:#f4f6f9}

/* HEADER */
.header{
background:linear-gradient(90deg,#4D148C,#FF6600);
color:#fff;
padding:20px;
text-align:center;
font-size:20px;
font-weight:bold
}

/* CONTAINER */
.container{max-width:1000px;margin:20px auto;padding:15px}

/* GRID */
.grid{display:flex;gap:15px;flex-wrap:wrap}
.left{flex:2}
.right{flex:1}

/* CARD */
.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,0.08)
}

/* INPUT */
input,textarea,select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
background:#FF6600;
color:#fff;
border:none;
border-radius:8px;
font-weight:bold
}

/* STATUS */
.status{
padding:12px;
border-radius:8px;
text-align:center;
color:#fff;
font-weight:bold
}

/* TIMELINE */
.timeline{border-left:4px solid #FF6600;padding-left:10px}
.history{background:#eee;padding:10px;margin-top:8px;border-radius:8px}

/* MAP */
.map{
height:220px;
background:#ddd;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
color:#555
}

/* ADMIN */
.admin-btn{
position:fixed;
bottom:20px;
right:20px;
background:#4D148C;
color:#fff;
width:60px;height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px
}

.hidden{display:none}

.footer{
background:#111;
color:#fff;
padding:20px;
text-align:center;
margin-top:30px
}
</style>
</head>

<body>

<div class="header">
🌍 GlobeX Logistics ✈️  
<p>Global Shipment Tracking</p>
</div>

<div class="container">

<!-- TRACK -->
<div id="trackPage">
<div class="card">
<input id="trackInput" placeholder="Enter tracking code">
<button onclick="track()">Track Shipment</button>
</div>

<div id="result"></div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="hidden">
<div class="card">
<h3>Admin Login</h3>
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- ADMIN -->
<div id="adminPage" class="hidden">
<div class="card">
<h3>Create Shipment</h3>

<input id="code" placeholder="Tracking Code">
<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="date" placeholder="Delivery Date">

<select id="status">
<option>In transit</option>
<option>Out for delivery</option>
<option>Delivered</option>
<option>Delayed</option>
</select>

<textarea id="manualHistory" placeholder="Comma separated timeline"></textarea>

<h4>Receiver Details</h4>
<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">
<input id="receiverEmail" placeholder="Email">
<input id="receiverPhone" placeholder="Phone">

<button onclick="save()">Save</button>
</div>
</div>

</div>

<div class="footer">
GlobeX Logistics • Worldwide Delivery
</div>

<div class="admin-btn" onclick="openAdmin()">⚙️</div>

<!-- PDF LIB -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyBQr2KtnYQWNUmFu_54AUzmM1zMw2las14",
authDomain:"fedex-tracking-system.firebaseapp.com",
projectId:"fedex-tracking-system"
});
const db = getFirestore(app);

// TRACK
window.track=async()=>{
let c=trackInput.value.trim();
let snap=await getDoc(doc(db,"shipments",c));

if(!snap.exists()){
result.innerHTML="<div class='card'>❌ Not found</div>";
return;
}

let d=snap.data();

let timeline="";
(d.manualHistory||[]).forEach(h=>{
timeline+=`<div class="history">${h}</div>`;
});

// STATUS COLOR
let color="#ff9800";
if(d.status==="Delivered") color="#28a745";
if(d.status==="Delayed") color="#dc3545";
if(d.status==="Out for delivery") color="#007bff";

result.innerHTML=`
<div class="grid">

<div class="left">
<div class="card">
<h3>Shipment Timeline</h3>
<div class="timeline">${timeline}</div>
</div>
</div>

<div class="right">

<div class="card">
<div class="status" style="background:${color}">${d.status}</div>
</div>

<div class="card">
<p><b>From:</b> ${d.from}</p>
<p><b>To:</b> ${d.to}</p>
<p><b>Tracking:</b> ${c}</p>
</div>

<div class="card">
<div class="map">Shipment Route Overview</div>
</div>

<div class="card">
<b>Receiver</b><br>
${d.receiverName}<br>
${d.receiverAddress}<br>
${d.receiverPhone}
<br><br>
<button onclick="downloadPDF('${c}')">Download Receipt 📄</button>
</div>

</div>

</div>
`;
};

// PDF FUNCTION
window.downloadPDF = async (code) => {

const { jsPDF } = window.jspdf;

let snap = await getDoc(doc(db,"shipments",code));
let d = snap.data();

const pdf = new jsPDF();

pdf.setFontSize(16);
pdf.text("GlobeX Logistics Receipt", 20, 20);

pdf.setFontSize(12);
pdf.text(`Tracking Code: ${code}`, 20, 40);
pdf.text(`From: ${d.from}`, 20, 50);
pdf.text(`To: ${d.to}`, 20, 60);
pdf.text(`Status: ${d.status}`, 20, 70);

pdf.text("Receiver:", 20, 90);
pdf.text(`${d.receiverName}`, 20, 100);
pdf.text(`${d.receiverAddress}`, 20, 110);
pdf.text(`${d.receiverPhone}`, 20, 120);

pdf.text("Thank you for choosing GlobeX Logistics", 20, 150);

pdf.save(`receipt_${code}.pdf`);
};

// ADMIN
window.openAdmin=()=>{
trackPage.classList.add("hidden");
loginPage.classList.remove("hidden");
};

window.login=()=>{
if(pass.value==="admin123"){
loginPage.classList.add("hidden");
adminPage.classList.remove("hidden");
}else alert("Wrong password");
};

window.save=async()=>{
await setDoc(doc(db,"shipments",code.value),{
from:from.value,
to:to.value,
deliveryDate:date.value,
status:status.value,
manualHistory: manualHistory.value.split(","),
receiverName:receiverName.value,
receiverAddress:receiverAddress.value,
receiverEmail:receiverEmail.value,
receiverPhone:receiverPhone.value
});
alert("Saved");
};
</script>

</body>
</html>
