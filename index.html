<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Premium Tracking (Free Map)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { background:#0b1220; color:white; font-family:Segoe UI; }
.container { padding:20px; }
.card { background:#111827; padding:15px; border-radius:12px; margin-bottom:15px; }
#map { height:350px; border-radius:12px; }
.msg { background:#1e293b; padding:10px; margin:5px; border-radius:8px; }
button { padding:10px; background:#22c55e; border:none; color:white; }
input { padding:10px; width:60%; }
</style>
</head>

<body>

<div class="container">

<div class="card">
<input id="trackId" placeholder="Tracking ID">
<button onclick="track()">Track</button>
</div>

<div class="card">
<div id="chat"></div>
<div id="eta"></div>
</div>

<div class="card">
<div id="map"></div>
</div>

</div>

<script>
let map, marker;

// SAMPLE DATA (you can replace with Firebase later)
const demoRoute = [
  {lat:26, lng:119},
  {lat:20, lng:120},
  {lat:14, lng:121}
];

function track(){
  drawMap(demoRoute);
  animate(demoRoute);
  showMessages(3);
  startETA(demoRoute);
}

// 🗺️ MAP
function drawMap(route){
  map = L.map('map').setView([route[0].lat, route[0].lng], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
    .addTo(map);

  marker = L.marker([route[0].lat, route[0].lng]).addTo(map);
}

// 🚚 SMOOTH MOVE
function animate(route){
  let i=0;

  function move(){
    if(i>=route.length-1) return;

    let start = route[i];
    let end = route[i+1];

    let step=0;

    let interval = setInterval(()=>{
      step += 0.02;

      let lat = start.lat + (end.lat-start.lat)*step;
      let lng = start.lng + (end.lng-start.lng)*step;

      marker.setLatLng([lat,lng]);

      if(step>=1){
        clearInterval(interval);
        i++;
        move();
      }
    },50);
  }

  move();
}

// 💬 STATUS
function showMessages(status){
  chat.innerHTML="";
  const msgs = ["Created","Picked up","In transit","Customs","Out for delivery","Delivered"];

  for(let i=0;i<status;i++){
    let div=document.createElement("div");
    div.className="msg";
    div.innerText=msgs[i];
    chat.appendChild(div);
  }
}

// ⏱ ETA
function startETA(route){
  let time = route.length * 20;

  function update(){
    eta.innerText = "ETA: " + time + "s";

    if(time>0){
      time--;
      setTimeout(update,1000);
    }else{
      eta.innerText="Arrived";
    }
  }

  update();
}
</script>

</body>
</html>
