<!DOCTYPE html>
<html>
<head>
  <title>Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { background:#0b1a2a; color:white; padding:20px; font-family:Arial; }
    input, button { padding:10px; margin:5px; border-radius:8px; border:none; }
    #map { height:300px; margin-top:20px; }
  </style>
</head>

<body>

<h2>📦 Tracking</h2>

<input id="tracking" placeholder="Tracking ID">
<button onclick="track()">Track</button>

<div id="status"></div>
<div id="map"></div>

<!-- Firebase SAFE VERSION -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
try {

const firebaseConfig = {
  apiKey: "PASTE_REAL_KEY",
  authDomain: "PASTE.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let map;

function track() {
  const id = document.getElementById("tracking").value;

  db.collection("shipments").doc(id).get().then(doc => {

    if (!doc.exists) {
      alert("Not found");
      return;
    }

    const data = doc.data();

    document.getElementById("status").innerHTML =
      "📦 In transit | ETA: " + (data.eta || "...");

    drawMap(data.route);

  }).catch(err => {
    alert("Firebase error: " + err.message);
  });
}

function drawMap(route) {
  if (!route || route.length === 0) return;

  const first = route[0];

  if (!map) {
    map = L.map('map').setView([first.lat, first.lng], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  }

  const points = route.map(p => [p.lat, p.lng]);

  L.polyline(points).addTo(map);
  L.marker(points[0]).addTo(map);
}

} catch(e) {
  document.body.innerHTML = "<h2 style='color:red'>ERROR: "+e.message+"</h2>";
}
</script>

</body>
</html>
