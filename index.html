<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Tracking</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f3f3f3}
.header{background:#4d148c;color:#fff;padding:15px;text-align:center;font-weight:bold}
.card{background:#fff;margin:15px;padding:15px;border-radius:10px}
input{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
button{width:100%;padding:12px;margin-top:10px;background:#ff6200;color:#fff;border:none;border-radius:8px}
.progress{background:#eee;height:8px;border-radius:10px}
.bar{height:8px;background:#ff6200;border-radius:10px}
</style>
</head>

<body>

<div class="header">GlobeX Logistics Tracking</div>

<div class="card">
<input id="code" placeholder="Enter Tracking Code">
<button onclick="track()">Track Package</button>
</div>

<div id="result"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
  authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
  projectId: "globaltrackingsystem-f14c2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* AUTO LOAD */
window.addEventListener("load",()=>{
  const p = new URLSearchParams(window.location.search);
  if(p.get("code")){
    code.value = p.get("code");
    track();
  }
});

async function track(){

  const trackingCode = code.value.trim();
  if(!trackingCode){ alert("Enter code"); return; }

  const doc = await db.collection("shipments").doc(trackingCode).get();
  if(!doc.exists){
    result.innerHTML = "<div class='card'>Not found</div>";
    return;
  }

  const d = doc.data();
  window.currentData = {trackingCode,...d};

  let progress = d.progress || 0;

  result.innerHTML = `
  <div class="card">

  <h2>${trackingCode}</h2>

  <p>ETA: <b id="eta"></b></p>

  <div class="progress">
    <div class="bar" style="width:${progress}%"></div>
  </div>

  <p><b>Status:</b> ${d.status}</p>

  <hr>

  <p><b>From:</b> ${d.from}</p>
  <p><b>To:</b> ${d.to}</p>

  <p><b>Weight:</b> ${d.weight || "-"}</p>
  <p><b>Type:</b> ${d.type || "-"}</p>
  <p><b>Courier:</b> ${d.courier || "-"}</p>

  <div id="map" style="height:200px;margin-top:10px"></div>

  <h3>Timeline</h3>
  ${(d.history||[]).map(h=>`<div>${h}</div>`).join("")}

  <h3>Receiver</h3>
  <p>${d.receiverName}</p>
  <p>${d.receiverAddress}</p>

  <button onclick="printReceipt()">Print Receipt</button>

  </div>
  `;

  startETA(d.eta || "May 5, 2026 18:00");

  setTimeout(()=>{
    const map = L.map("map").setView([20,120],4);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

    const path = [
      [31.23,121.47],
      [22.31,114.17],
      [14.59,120.98]
    ];

    const marker = L.marker(path[0]).addTo(map);
    const line = L.polyline(path,{color:"#ff6200"}).addTo(map);

    map.fitBounds(line.getBounds());

    let i=0;
    const move = setInterval(()=>{
      i++;
      if(i>=path.length) clearInterval(move);
      else marker.setLatLng(path[i]);
    },1500);

  },200);

}

/* ETA */
function startETA(dateString){
  const el = document.getElementById("eta");
  const target = new Date(dateString).getTime();

  setInterval(()=>{
    const now = new Date().getTime();
    const diff = target-now;

    if(diff<=0){ el.innerHTML="Delivered"; return; }

    const h = Math.floor(diff/(1000*60*60));
    const m = Math.floor((diff%(1000*60*60))/(1000*60));

    el.innerHTML = h+"h "+m+"m";
  },1000);
}

/* RECEIPT */
function printReceipt(){
  const w = window.open("");
  w.document.write(`
  <h2>GlobeX Receipt</h2>
  <p>${currentData.trackingCode}</p>
  <p>${currentData.receiverName}</p>
  `);
  w.print();
}

</script>

</body>
</html>
