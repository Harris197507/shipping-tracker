<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<style>
body{font-family:'Segoe UI';margin:0;background:#f4f6f9;}
.header{background:linear-gradient(90deg,#4D148C,#FF6600);color:white;padding:20px;text-align:center;font-size:22px;}
.container{max-width:500px;margin:20px auto;background:white;padding:20px;border-radius:12px;}

input{width:100%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #ccc;}
button{width:100%;padding:12px;margin-top:10px;background:#FF6600;color:white;border:none;border-radius:8px;}

.status{padding:10px;border-radius:8px;margin-top:10px;color:white;}
.history{background:#eee;padding:10px;margin-top:6px;border-radius:8px;}
.timeline{border-left:4px solid #FF6600;padding-left:10px;margin-top:10px;}
.pay-btn{background:#28a745;}
</style>
</head>

<body>

<div class="header">
🌎 GlobeX Logistics ✈️  
<p>Delivering Beyond Borders 🚚📦</p>
</div>

<div class="container">
<h2>Track Shipment 📦</h2>
<input id="trackInput" placeholder="Enter tracking code">
<button onclick="track()">Track</button>

<div id="result"></div>
</div>

<script src="https://js.stripe.com/v3/"></script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyBQr2KtnYQWNUmFu_54AUzmM1zMw2las14",
authDomain:"fedex-tracking-system.firebaseapp.com",
projectId:"fedex-tracking-system"
});

const db=getFirestore(app);

// AUTO SYSTEM
function autoHistory(date){
let today=new Date();
let delivery=new Date(date);
let diff=Math.ceil((delivery-today)/(1000*60*60*24));

let steps=[
"📦 Package received",
"✈️ In transit",
"🌎 Arrived destination",
"🚚 Out for delivery",
"✅ Ready for delivery payment"
];

let history=[];

for(let i=0;i<steps.length;i++){
if(i<=5-diff) history.push(steps[i]);
}

return history;
}

// TRACK
window.track=async()=>{
let code=trackInput.value;
let snap=await getDoc(doc(db,"shipments",code));

if(!snap.exists()){
result.innerHTML="❌ Not found";
return;
}

let d=snap.data();
let history=autoHistory(d.deliveryDate);

let html="";

history.forEach(h=>{
html+=`<div class="history">${h}</div>`;
});

// SHOW PAYMENT BUTTON ONLY AT FINAL STAGE
let showPay = history.includes("✅ Ready for delivery payment");

result.innerHTML=`
<h3>${code}</h3>
<div class="status" style="background:#ff9800">${history[history.length-1]}</div>
<p><b>From:</b> ${d.from}</p>
<p><b>To:</b> ${d.to}</p>
<div class="timeline">${html}</div>

${showPay ? `<button class="pay-btn" onclick="pay()">Pay for Delivery 💳</button>` : ""}
`;
}

// STRIPE PAYMENT
const stripe = Stripe("YOUR_PUBLIC_KEY");

window.pay=function(){
stripe.redirectToCheckout({
lineItems:[{price:"price_xxx",quantity:1}],
mode:"payment",
successUrl:window.location.href,
cancelUrl:window.location.href
});
}
</script>

</body>
</html>
