<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f3f3f3}
.header{background:#4d148c;color:white;padding:15px;text-align:center;font-weight:bold}
.card{background:white;margin:12px;padding:15px;border-radius:12px}
input,textarea{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:1px solid #ccc}
button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:6px;background:#ff6200;color:white;font-weight:bold}
.progress{background:#eee;border-radius:6px;margin-top:10px}
.progress-bar{height:8px;background:#ff6200}
.timeline .step{padding:8px;border-left:3px solid #ddd;margin-top:6px}
.timeline .done{border-color:#ff6200;background:#fff3ea}
.code{font-weight:bold;font-size:18px}
.hidden{display:none}
</style>
</head>

<body>

<div class="header">FedEx Tracking • GlobeX Logistics</div>

<div class="card">
<input id="adminCode" placeholder="Admin Code">
<button onclick="openAdmin()">Enter</button>
</div>

<div class="card">
<input id="trackInput" placeholder="Tracking Code">
<button onclick="track()">Track Package</button>
</div>

<div id="adminPage" class="card hidden">
<h3>Create Shipment</h3>

<input id="from" placeholder="From">
<input id="to" placeholder="To">
<input id="status" placeholder="Status">
<textarea id="history" placeholder="Timeline (comma separated)"></textarea>

<input id="receiverName" placeholder="Receiver Name">
<input id="receiverAddress" placeholder="Receiver Address">

<button onclick="save()">Save</button>

<h3>Shipments</h3>
<div id="list"></div>
</div>

<div id="result" class="card hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCXdd0GWOaRzHacaEk1JH-iFKH7IJ1td-Y",
  authDomain: "globaltrackingsystem-f14c2.firebaseapp.com",
  projectId: "globaltrackingsystem-f14c2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function openAdmin(){
  if(adminCode.value==="admin1234"){
    adminPage.classList.remove("hidden");
    loadList();
  }else alert("Wrong code");
}

async function save(){

  if(!from.value || !to.value || !receiverName.value) return alert("Fill fields");

  const code="GLO"+Math.floor(100000+Math.random()*900000);

  await db.collection("shipments").doc(code).set({
    from:from.value,
    to:to.value,
    status:status.value || "In transit",
    history:history.value?history.value.split(",").map(x=>x.trim()):[],
    receiverName:receiverName.value,
    receiverAddress:receiverAddress.value
  });

  alert("Saved: "+code);
  loadList();
}

function loadList(){
  db.collection("shipments").onSnapshot(snap=>{
    list.innerHTML="";
    snap.forEach(doc=>{
      let d=doc.data();
      list.innerHTML+=`
        <div>
        <b>${doc.id}</b><br>
        ${d.from} → ${d.to}<br>
        ${d.receiverName}<br>
        <button onclick="del('${doc.id}')">Delete</button>
        </div>`;
    });
  });
}

function del(id){
  db.collection("shipments").doc(id).delete();
}

function buildStages(){
  return [
    "Shipment received",
    "Picked up",
    "In transit",
    "Arrived destination",
    "Out for delivery",
    "Delivered"
  ];
}

async function track(){

  let code=trackInput.value.trim();
  let snap=await db.collection("shipments").doc(code).get();

  if(!snap.exists) return alert("Not found");

  let d=snap.data();
  let timeline=d.history.length?d.history:buildStages();

  let progress=Math.min(timeline.length*20,100);

  window.currentData={code,...d};

  result.classList.remove("hidden");

  result.innerHTML=`
    <div class="code">${code}</div>

    <div class="progress">
      <div class="progress-bar" style="width:${progress}%"></div>
    </div>

    <p>${d.from} → ${d.to}</p>
    <p>${d.status}</p>

    <p>${d.receiverName}<br>${d.receiverAddress}</p>

    <div id="map" style="height:200px;margin-top:10px"></div>

    <div class="timeline">
      ${timeline.map((h,i)=>`
        <div class="step ${i<progress/20?"done":""}">
        ${h}
        </div>`).join("")}
    </div>

    <button onclick="printReceipt()">🧾 Receipt</button>
  `;

  let map=L.map('map').setView([10,10],2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  let fromCoords=[31.2304,121.4737];
  let toCoords=[14.5995,120.9842];

  let latlngs=[];
  let line=L.polyline(latlngs,{color:'#ff6200'}).addTo(map);

  map.fitBounds([fromCoords,toCoords]);

  let i=0;
  let steps=100;

  let draw=setInterval(()=>{
    if(i>steps) return clearInterval(draw);
    let lat=fromCoords[0]+(toCoords[0]-fromCoords[0])*(i/steps);
    let lng=fromCoords[1]+(toCoords[1]-fromCoords[1])*(i/steps);
    latlngs.push([lat,lng]);
    line.setLatLngs(latlngs);
    i++;
  },40);
}

function printReceipt(){
  let w=window.open("");
  w.document.write(`
    <h2>GlobeX Logistics</h2>
    Tracking: ${currentData.code}<br><br>
    From: ${currentData.from}<br>
    To: ${currentData.to}<br>
    Receiver: ${currentData.receiverName}<br>
    ${currentData.receiverAddress}<br>
    <br>||| ${currentData.code} |||
  `);
  w.print();
}

</script>

</body>
</html>
