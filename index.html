<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeX Logistics</title>

<style>
body{font-family:Arial;margin:0;background:#f4f6f9}

.header{
background:linear-gradient(90deg,#4D148C,#FF6600);
color:#fff;
padding:20px;
text-align:center;
font-weight:bold;
}

.container{
max-width:500px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#FF6600;
color:#fff;
border:none;
border-radius:8px;
font-weight:bold;
}

.hidden{display:none}

.admin-btn{
position:fixed;
bottom:80px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:#4D148C;
color:#fff;
font-size:22px;
border:none;
}
</style>
</head>

<body>

<div class="header">
🌍 GlobeX Logistics ✈️  
<p>International Freight • Secure Delivery • Verified Tracking</p>
</div>

<!-- TRACK PAGE -->
<div class="container" id="trackPage">
<input id="trackInput" placeholder="Enter tracking code">
<button onclick="track()">Track Shipment</button>
<div id="result"></div>
</div>

<!-- LOGIN -->
<div class="container hidden" id="loginPage">
<h2>Admin Login 🔐</h2>
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- ADMIN -->
<div class="container hidden" id="adminPage">
<h2>Create Shipment</h2>

<input id="code" placeholder="Tracking Code (Auto)" readonly>
<input id="from" placeholder="From">
<input id="to" placeholder="To">

<select id="status">
<option>In transit</option>
<option>Out for delivery</option>
<option>Delivered</option>
<option>Delayed</option>
</select>

<textarea id="history" placeholder="Comma separated timeline"></textarea>

<h3>Receiver</h3>
<input id="receiverName" placeholder="Name">
<input id="receiverAddress" placeholder="Address">
<input id="receiverPhone" placeholder="Phone">

<button onclick="save()">Save</button>

<div id="list"></div>

<button onclick="goBack()">⬅ Back</button>
</div>

<button class="admin-btn" onclick="openAdmin()">⚙️</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyBQr2KtnYQWNUmFu_54AUzmM1zMw2las14",
authDomain:"fedex-tracking-system.firebaseapp.com",
projectId:"fedex-tracking-system"
});
const db = getFirestore(app);

function generateCode(){
const num = Math.floor(10000 + Math.random() * 90000);
return "GLO" + num;
}

// TRACK
window.track = async ()=>{
let code = document.getElementById("trackInput").value.trim();
if(!code) return;

let snap = await getDoc(doc(db,"shipments",code));

if(!snap.exists()){
result.innerHTML="❌ Not found";
return;
}

let d = snap.data();

result.innerHTML = `
<h3>${code}</h3>
<p>Status: ${d.status}</p>
<p>From: ${d.from}</p>
<p>To: ${d.to}</p>
<p>${d.manualHistory?.join("<br>") || ""}</p>
<p><b>${d.receiverName}</b></p>
`;
};

// ADMIN OPEN
window.openAdmin = ()=>{
document.getElementById("trackPage").classList.add("hidden");
document.getElementById("loginPage").classList.remove("hidden");
};

// LOGIN
window.login = ()=>{
if(document.getElementById("pass").value==="admin123"){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("adminPage").classList.remove("hidden");
load();
}else alert("Wrong password");
};

// SAVE
window.save = async ()=>{

if(!from.value || !to.value){
alert("Fill required fields");
return;
}

let trackingCode = code.value || generateCode();

await setDoc(doc(db,"shipments",trackingCode),{
from: from.value.trim(),
to: to.value.trim(),
status: status.value,
manualHistory: history.value ? history.value.split(",") : [],
receiverName: receiverName.value,
receiverAddress: receiverAddress.value,
receiverPhone: receiverPhone.value
});

code.value = trackingCode;

alert("Saved: "+trackingCode);
load();
};

// LOAD
async function load(){
let snap = await getDocs(collection(db,"shipments"));
let html="";
snap.forEach(d=>{
html += `<div>${d.id} 
<button onclick="delItem('${d.id}')">Delete</button>
</div>`;
});
list.innerHTML = html;
}

// DELETE
window.delItem = async(id)=>{
await deleteDoc(doc(db,"shipments",id));
load();
};

// BACK
window.goBack = ()=>{
document.getElementById("adminPage").classList.add("hidden");
document.getElementById("trackPage").classList.remove("hidden");
};

</script>

</body>
</html>
