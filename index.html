<!DOCTYPE html>
<html>
<head>
  <title>Global Express Tracking</title>

  <style>
    body {
      font-family: 'Segoe UI', Arial;
      background: #eef2f7;
      margin: 0;
    }

    .header {
      background: linear-gradient(90deg,#4D148C,#6a1bbf);
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ff6600;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e65c00;
    }

    .status {
      font-weight: bold;
      margin-top: 15px;
      font-size: 18px;
    }

    .progress {
      background: #eee;
      border-radius: 20px;
      margin: 15px 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 10px;
      background: linear-gradient(90deg,#4D148C,#ff6600);
      transition: width 0.5s ease;
    }

    .delivery-box {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    /* TIMELINE */
    .timeline {
      margin-top: 20px;
      border-left: 3px solid #4D148C;
      padding-left: 15px;
    }

    .timeline-item {
      margin-bottom: 15px;
      position: relative;
    }

    .circle {
      width: 12px;
      height: 12px;
      background: #ff6600;
      border-radius: 50%;
      position: absolute;
      left: -22px;
      top: 5px;
    }

    .content {
      background: #f1f3f6;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="header">Global Express Tracking</div>

<div class="container">
  <h2>Track Your Shipment</h2>

  <input id="tracking-input" placeholder="Enter tracking code">
  <button id="track-btn">Track</button>

  <div id="result"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQr2KtnYQWNUmFu_54AUzmM1zMw2las14",
  authDomain: "fedex-tracking-system.firebaseapp.com",
  projectId: "fedex-tracking-system",
  storageBucket: "fedex-tracking-system.firebasestorage.app",
  messagingSenderId: "936338746045",
  appId: "1:936338746045:web:b325204663ef1f7bece5d4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function track() {
  const trackingCode = document.getElementById("tracking-input").value.trim();

  if (!trackingCode) {
    alert("Enter tracking code");
    return;
  }

  const docRef = doc(db, "shipments", trackingCode);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {
    const data = docSnap.data();

    let statusColor = "#ff9800";
    if (data.status === "Delivered") statusColor = "#28a745";
    if (data.status === "Pending") statusColor = "#dc3545";

    let progress = (data.history.length / data.history.length) * 100;

    let today = new Date();
    let delivery = new Date(data.deliveryDate);
    let daysLeft = Math.ceil((delivery - today) / (1000 * 60 * 60 * 24));

    let historyHTML = "";
    data.history.forEach((item) => {
      historyHTML += `
        <div class="timeline-item">
          <div class="circle"></div>
          <div class="content">${item}</div>
        </div>
      `;
    });

    document.getElementById("result").innerHTML =
      "<p class='status' style='color:" + statusColor + "'>Status: " + data.status + "</p>" +

      "<div class='progress'>" +
      "<div class='progress-bar' style='width:" + progress + "%'></div>" +
      "</div>" +

      "<p><strong>From:</strong> " + data.from + "</p>" +
      "<p><strong>To:</strong> " + data.to + "</p>" +

      "<div class='delivery-box'>" +
      "<p><strong>Estimated Delivery:</strong> " + data.deliveryDate + "</p>" +
      "<p><strong>Days Left:</strong> " + daysLeft + " day(s)</p>" +
      "</div>" +

      "<h3>Shipment Timeline</h3>" +
      "<div class='timeline'>" + historyHTML + "</div>";

  } else {
    alert("Tracking code not found");
  }
}

document.getElementById("track-btn").addEventListener("click", track);
</script>

</body>
</html>
